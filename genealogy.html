<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>성경 인물 가계도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽 넓은 가계도(이름과 선만), 오른쪽 사이드바(설명). 휴대폰은 사이드바가 아래에서 올라옴 */
:root{
  --ground:#f4f1ea; --paper:#fbfaf6; --surface:#ffffff; --ink:#22211d; --ink-2:#57554d; --muted:#8c897e;
  --line:#e2ded3; --band:#efebe1; --hover:#f1efe7;
  --node:#ffffff; --node-line:#cfc9bb; --wire:#8f8a7c; --focus:#22211d; --focus-ink:#fbfaf6;
  --gold:#b57a00; --accent:#2f6fb5;
  --display:"Gowun Batang",serif; --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --navh:44px; --sidew:340px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151513; --paper:#1a1a18; --surface:#1f1f1c; --ink:#f0eee7; --ink-2:#bdbab0; --muted:#8a877d;
    --line:#2f2e2a; --band:#22211e; --hover:#272622;
    --node:#23221f; --node-line:#45433d; --wire:#76726a; --focus:#f0eee7; --focus-ink:#151513;
    --gold:#dba53a; --accent:#5b9be0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#151513; --paper:#1a1a18; --surface:#1f1f1c; --ink:#f0eee7; --ink-2:#bdbab0; --muted:#8a877d;
  --line:#2f2e2a; --band:#22211e; --hover:#272622;
  --node:#23221f; --node-line:#45433d; --wire:#76726a; --focus:#f0eee7; --focus-ink:#151513;
  --gold:#dba53a; --accent:#5b9be0; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{position:relative;height:calc(100% - var(--navh));display:grid;grid-template-columns:minmax(0,1fr) var(--sidew)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
#tree{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#tree.drag{cursor:grabbing}

/* 가계도: 이름과 선만 */
.wire{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.wire.dash{stroke-dasharray:4 5}
.mar{stroke:var(--wire);stroke-width:2.2}
.ring{fill:var(--paper);stroke:var(--wire);stroke-width:1.6}
.nd{cursor:pointer}
.nd rect.box{fill:var(--node);stroke:var(--node-line);stroke-width:1.4}
.nd text{font-family:var(--ui);font-size:14px;font-weight:600;fill:var(--ink);pointer-events:none}
.nd .mb{fill:var(--gold)}
.nd:hover rect.box{stroke:var(--ink-2)}
.nd.fo rect.box{fill:var(--focus);stroke:var(--focus)}
.nd.fo text{fill:var(--focus-ink)}
.nd.al rect.box{fill:transparent;stroke-dasharray:5 4}
.nd.al text{fill:var(--ink-2);font-weight:500}
.nd.al .arr{font-size:11px;fill:var(--muted)}
.bd{cursor:pointer}
.bd circle{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.bd text{font-family:var(--ui);font-size:11px;font-weight:700;fill:#fff;pointer-events:none}
.bd.open circle{fill:var(--muted)}
.ch{cursor:pointer}
.ch rect{fill:var(--band);stroke:var(--node-line);stroke-width:1.2;stroke-dasharray:3 3}
.ch text{font-family:var(--ui);font-size:12px;font-weight:600;fill:var(--ink-2);pointer-events:none}
.ch.fixed{cursor:default}
.blk{fill:var(--band);stroke:var(--line);stroke-width:1}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:3}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.tools button:hover{background:var(--hover)}

/* 사이드바 */
.side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.sh{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sh select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.pc{border:1px solid var(--line);background:var(--band);color:var(--ink);border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;cursor:pointer;line-height:1.6}
.pc:hover{background:var(--hover)}
.pc.cur{background:var(--ink);color:var(--surface);border-color:var(--ink);cursor:default}
.pc.main{border-color:var(--gold)}
.handle{display:none}
.info{flex:1 1 auto;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.grp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.grp i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.grp.main i{background:var(--gold)}
.info h2{font-family:var(--display);font-size:24px;margin:4px 0 0;text-wrap:balance}
.yrs{margin:2px 0 0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kb{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);margin-left:4px;vertical-align:1px}
.why{margin:12px 0 0;font-size:14.5px}
.why::before{content:'왜 나오나 · ';color:var(--muted);font-size:12px}
.nt{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.nat{display:inline-block;margin:10px 0 0;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.ref{margin:10px 0 0;font-size:12px;color:var(--muted)}
.lbl{margin:16px 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center;font-size:12px}
.chain .s{color:var(--muted)}
.fam{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;align-items:baseline;margin:0}
.fam dt{color:var(--muted)}
.fam dd{margin:0;display:flex;flex-wrap:wrap;gap:4px}
.go{display:inline-block;margin-top:16px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.go:hover{text-decoration:underline}
.howto{border-top:1px solid var(--line);padding:10px 16px 14px;font-size:12.5px;color:var(--ink-2)}
.howto summary{cursor:pointer;font-weight:600;color:var(--ink)}
.howto ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 지도 속 작은 창 */
.embed .snav,.embed .side{display:none!important}
.embed .app{height:100%;grid-template-columns:minmax(0,1fr)}
.embed .tools{left:8px;bottom:8px}
.embed .tools button{height:32px;min-width:32px;font-size:12px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;left:0;right:0;bottom:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.12);z-index:4;transition:height .25s ease}
  .side.peek{height:150px}
  .handle{display:flex;justify-content:center;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;padding:7px 0 0;cursor:pointer;width:100%}
  .handle::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--line)}
  .sh{order:3;border-bottom:0;border-top:1px solid var(--line)}
  .side.peek .sh,.side.peek .howto{display:none}
  .info{padding:6px 16px 14px}
  .info h2{font-size:21px}
  .howto{order:4}
  .tools{bottom:calc(46% + 10px)}
  .app.peek .tools{bottom:160px}
}
@media (prefers-reduced-motion: reduce){.side{transition:none}}
</style>
<style>
.snav{--navh:44px;height:var(--navh);display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--line,#e3e2dc);background:var(--surface,#fff);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;overflow-x:auto;white-space:nowrap;box-sizing:border-box}
.snav a{color:var(--ink-2,#55544e);text-decoration:none;padding:6px 10px;border-radius:7px;flex:0 0 auto}
.snav a:hover{background:var(--band,#efeee9);color:var(--ink,#1c1c1a)}
.snav a[aria-current="page"]{background:var(--band,#efeee9);color:var(--ink,#1c1c1a);font-weight:600}
.snav .brand{font-family:"Gowun Batang",serif;font-weight:700;font-size:14px;color:var(--ink,#1c1c1a);margin-right:6px}
.snav .brand:hover{background:none}
</style>
<nav class="snav" aria-label="사이트 메뉴"><a class="brand" href="index.html">성경 8주 개관</a><a href="index.html">홈</a><a href="map.html">지도</a><a href="genealogy.html" aria-current="page">인물</a><a href="timeline.html">연대표</a></nav>
<div class="app" id="app">
  <div class="stage" id="stage">
    <svg id="tree" role="img" aria-label="성경 인물 가계도"><g id="g"></g></svg>
    <div class="tools"><button id="fit" aria-label="전체 맞추기">맞추기</button><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">−</button></div>
  </div>

    <button class="handle" id="handle" aria-label="설명 펼치기"></button>

      <select id="find" aria-label="인물 찾기"></select>
      <div class="quick" id="quick"></div>

    <div class="info" id="info" aria-live="polite"></div>
    <details class="howto">
      <summary>보는 법</summary>
      <ul>
        <li><svg width="34" height="20"><rect x="1" y="2" width="32" height="16" rx="5" fill="var(--node)" stroke="var(--node-line)"/></svg>사람이에요. 누르면 그 사람을 가운데 두고 가계도를 다시 그려요</li>
        <li><svg width="34" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="var(--wire)" stroke-width="2"/><circle cx="17" cy="10" r="4" fill="var(--paper)" stroke="var(--wire)" stroke-width="1.6"/></svg>결혼한 사이</li>
        <li><svg width="34" height="22"><path d="M17 1 V8 M6 8 H28 M6 8 V20 M28 8 V20" fill="none" stroke="var(--wire)" stroke-width="1.6"/></svg>아래로 갈라진 선은 자녀</li>
        <li><svg width="34" height="22"><circle cx="17" cy="11" r="9" fill="var(--accent)"/><text x="17" y="15" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">+3</text></svg>아직 안 보이는 자녀 수예요. 누르면 펼쳐져요</li>
        <li><svg width="34" height="20"><rect x="1" y="3" width="32" height="14" rx="7" fill="var(--band)" stroke="var(--node-line)" stroke-dasharray="3 3"/></svg>한 명씩만 이어지는 세대를 접어 둔 거예요. 누르면 펼쳐져요</li>
        <li><svg width="34" height="20"><rect x="1" y="2" width="32" height="16" rx="5" fill="none" stroke="var(--node-line)" stroke-dasharray="5 4"/></svg>다른 집안으로 결혼해 간 사람이 태어난 자리예요. 진짜 카드는 배우자 옆에 있어요</li>
        <li><svg width="34" height="20"><rect x="1" y="2" width="32" height="16" rx="5" fill="var(--node)" stroke="var(--node-line)"/><rect x="5" y="2" width="24" height="3" fill="var(--gold)"/></svg>이야기가 따라가는 줄기예요. 아담에서 노아, 아브라함, 야곱을 거쳐 모세까지</li>
      </ul>
    </details>
  </aside>
</div>

<script>
// ===== 지도 데이터 (1·2주) =====
// 좌표는 [경도, 위도]. 연대는 전통적(보수적) 연대 기준 대략치.
// 위치가 전통적 추정인 곳은 note에 적음.

const PLACES = {
  // --- 메소포타미아·북쪽
  '우르':        {p:[46.10,30.96], note:"아브라함이 아버지 데라와 함께 떠난 고향이에요. 지금의 이라크 남부, 유프라테스강 하류에 있던 수메르의 큰 도시였어요."},
  '바벨':        {p:[44.42,32.54], note:"시날 평지에서 사람들이 탑을 쌓다가 말이 뒤섞이고 흩어진 곳이에요(창 11장). 훗날 바벨론이 되는 곳으로, 지금의 이라크 바그다드 남쪽에 있어요."},
  '하란':        {p:[39.03,36.87], note:"데라가 죽은 뒤 75세의 아브라함이 다시 길을 떠난 곳이에요. 훗날 야곱도 여기서 외삼촌 라반 밑에서 20년을 살았죠. 지금의 튀르키예 남동부예요."},
  '아라랏산':    {p:[44.30,39.70], note:"홍수가 끝나고 방주가 \"아라랏 산지\"에 머물렀어요(창 8장). 성경에는 산지라고만 나와서, 이 봉우리는 후대에 전해진 전통적 위치예요."},
  '다메섹':      {p:[36.29,33.51], note:"아브라함의 종 엘리에셀의 고향이에요(창 15:2). 지금의 시리아 수도 다마스쿠스죠."},
  '단':          {p:[35.65,33.25], note:"잡혀간 롯을 구하려고 아브라함이 여기까지 쫓아왔어요(창 14:14). 그때 이름은 라이스였어요. 단은 사사 시대에 단 지파가 이 성을 차지하고 붙인 이름이라, 창세기에는 나중 이름으로 나와요(삿 18:29)."},
  '르홉':        {p:[36.35,34.19], note:"열두 정탐꾼이 올라간 가장 북쪽 끝이에요. 성경에는 \"하맛 어귀 르홉\"으로 나와요(민 13:21)."},
  // --- 가나안
  '세겜':        {p:[35.28,32.21], note:"아브라함이 가나안에 들어와서 처음 제단을 쌓은 곳이에요. 훗날 여호수아가 온 백성을 여기 모아 마지막 언약을 맺었죠(수 24장)."},
  '도단':        {p:[35.21,32.42], note:"요셉이 형들을 찾아왔다가 은 20에 팔려 간 곳이에요(창 37장)."},
  '벧엘':        {p:[35.22,31.93], note:"아브라함이 두 번째 제단을 쌓은 곳이에요(창 12:8). 야곱은 도망가던 길에 여기서 사다리 꿈을 꾸었고(28장), 돌아와서 다시 제단을 쌓았어요(35장)."},
  '아이':        {p:[35.26,31.92], note:"아간의 죄 때문에 이스라엘이 처음으로 진 성이에요. 다시 쳐들어가서 결국 함락했어요(수 7–8장)."},
  '실로':        {p:[35.29,32.06], note:"정복을 마치고 성막을 세운 곳이에요. 아직 남은 땅도 여기서 지파들에게 나눠 줬어요(수 18장)."},
  '딤낫세라':    {p:[35.16,32.12], note:"여호수아가 110세에 죽어서 묻힌 곳이에요(수 24:29–30)."},
  '살렘':        {p:[35.23,31.78], note:"아브라함이 살렘 왕 멜기세덱을 만난 곳이에요(창 14장). 이삭을 바치려던 모리아 산과 함께, 전통적으로 훗날의 예루살렘으로 봐요."},
  '기브온':      {p:[35.19,31.85], note:"먼 나라에서 온 척 속여서 이스라엘과 동맹을 맺은 성이에요(수 9장). 그래서 남부 다섯 왕이 기브온을 치자 여호수아가 구하러 왔죠."},
  '아얄론':      {p:[35.03,31.84], note:"여호수아가 기도하자 해는 기브온 위에, 달은 이 아얄론 골짜기 위에 멈춰 섰어요(수 10:12)."},
  '베들레헴':    {p:[35.20,31.70], note:"라헬이 베냐민을 낳다가 죽어, 이곳으로 가는 길가에 묻혔어요. 그때는 에브랏이라고 불렸어요(창 35:16–20)."},
  '헤브론':      {p:[35.10,31.53], note:"아브라함이 살던 곳으로, 마므레라고도 해요. 막벨라 굴은 아브라함 가족의 무덤이 됐고, 훗날 이 땅은 갈렙이 받았어요(수 14장)."},
  '라기스':      {p:[34.85,31.56], note:"기브온을 치러 온 남부 다섯 왕의 성 중 하나예요. 기브온 전투가 끝난 뒤 여호수아에게 함락됐어요(수 10:31–32)."},
  '브엘세바':    {p:[34.79,31.25], note:"이름이 \"맹세의 우물\"이라는 뜻이에요. 아브라함, 이삭, 야곱이 머물던 남쪽 거점이었고, 지금도 이스라엘 남부에 있는 도시예요."},
  '그랄':        {p:[34.61,31.38], note:"아비멜렉 왕의 성이에요. 아브라함이 여기 머물렀고(창 20장), 나중에 이삭도 기근 때 여기 머물면서 우물을 팠어요(창 26장)."},
  '가사':        {p:[34.47,31.50], note:"이집트와 가나안을 잇는 해안 길의 관문이에요. 출애굽 때 이스라엘은 이 가까운 길로 가지 않고 광야로 돌아갔어요(출 13:17–18). 지금의 가자예요."},
  '소돔':        {p:[35.38,31.08], note:"롯이 물이 넉넉한 요단 들을 고르고 장막을 옮겨 간 성이에요(창 13장). 창세기 19장에서 멸망했고, 위치는 사해 남쪽으로 추정해요."},
  '소알':        {p:[35.42,30.97], note:"소돔이 망하던 날 롯이 피해 간 작은 성이에요(창 19장). (전통적 위치)"},
  '모압 산지':   {p:[35.75,31.05], note:"롯이 두 딸과 함께 굴에 숨어 살던 산이에요. 그 자손이 모압과 암몬이 됐어요(창 19:30–38). (위치 근사)"},
  '여리고':      {p:[35.44,31.87], note:"요단강을 건너서 처음 마주한 성이에요. 7일 동안 성을 돌았더니 성벽이 무너졌어요(수 6장)."},
  '길갈':        {p:[35.49,31.86], note:"요단을 건너 처음 진을 치고 돌 열두 개를 세운 곳이에요. 정복 전쟁 내내 여기가 본부였어요."},
  '모압 평지':   {p:[35.64,31.84], note:"싯딤이라고도 불러요. 광야 40년이 끝나 갈 때 모세가 고별 설교(신명기)를 한 곳이고, 발람 사건도 이 무렵 여기서 일어났어요."},
  '느보산':      {p:[35.73,31.77], note:"모세가 올라가서 약속의 땅을 바라보고, 120세에 죽은 산이에요(신 34장). 지금의 요르단에 있어요."},
  '헤스본':      {p:[35.81,31.80], note:"아모리 왕 시혼의 수도예요. 이스라엘이 시혼을 꺾고 이 땅을 차지했죠(민 21장)."},
  '브니엘':      {p:[35.65,32.18], note:"얍복 강가에서 야곱이 밤새 씨름하다가 \"이스라엘\"이라는 새 이름을 받은 곳이에요(창 32장)."},
  '에드레이':    {p:[36.10,32.62], note:"이스라엘이 바산 왕 옥을 물리친 곳이에요(민 21:33–35)."},
  '아르논':      {p:[35.78,31.47], note:"모압 땅과 아모리 땅의 경계가 되는 강이에요. 에돔과 모압 땅을 빙 돌아온 이스라엘이 이 강을 건너 북쪽으로 올라갔어요(민 21:13, 신 2:24)."},
  '하솔':        {p:[35.57,33.02], note:"북부 연합군을 이끈 야빈 왕의 성이에요. 여호수아가 메롬 물가에서 연합군을 이긴 뒤 하솔을 불태웠어요(수 11장)."},
  '세일':        {p:[35.45,30.45], note:"에서가 자리 잡은 산지로, 나중에 에돔이라고 불려요. 원래는 호리 족속이 살던 땅이었고요."},
  '우스':        {p:[36.60,30.70], note:"욥의 고향이에요. 어디였는지 확실하지 않아서, 에돔 동쪽이나 북아라비아쯤으로 추정해요."},

  '온':          {p:[31.33,30.13], note:"태양신을 섬기던 도시로, 헬리오폴리스라고도 불러요. 요셉의 아내 아스낫이 이곳 제사장의 딸이었어요(창 41:45)."},
  '멤피스':      {p:[31.25,29.85], note:"지금의 카이로 남쪽에 있던 오래된 이집트 도시예요. 요셉과 모세 때 바로의 궁도 이 근처로 추정해요. 수도는 시대마다 바뀌었지만(이티타위, 테베) 멤피스는 늘 북쪽의 큰 거점이었어요."},

  '홍해 횡단':   {p:[32.55,29.95], note:"바다가 갈라져 이스라엘은 건너고, 뒤쫓던 바로의 군대는 물에 빠진 곳이에요(출 14장). 전통적으로는 수에즈만 북쪽으로 보지만, 아카바만이라는 설도 있어요."},

  '엘림':        {p:[32.95,29.25], note:"마라 다음에 닿은 쉼터예요. 샘이 12개, 종려나무가 70그루 있었대요(출 15:27). (위치 추정)"},
  '르비딤':      {p:[33.65,28.72], note:"반석에서 물이 나왔고, 아말렉과 처음 싸운 곳이에요(출 17장). (위치 추정)"},
  '시내산':      {p:[33.98,28.54], note:"호렙이라고도 해요. 모세가 떨기나무 앞에서 부르심을 받은 곳이고, 나중에 이스라엘이 1년 가까이 머물면서 십계명을 받고 성막을 지었어요. 전통적 위치는 예벨 무사예요."},
  '가데스바네아':{p:[34.42,30.65], note:"열두 정탐꾼을 보낸 곳이에요. 백성이 믿지 못한 탓에 그 세대는 광야에서 38년을 맴돌았는데, 그동안 중심이 된 곳이 여기예요."},

  '미디안':      {p:[35.02,28.47], note:"모세가 이집트에서 도망쳐 40년을 산 땅이에요. 장인 이드로의 고향이기도 하고요. 아카바만 동쪽 해안의 알바드 부근, 지금의 사우디아라비아 북서부로 봐요."},

  {week:1, id:'w1-2', title:'아브라함의 부르심', ref:'창 11:31–12:9', era:'BC 2100경', view:'world', layer:'w1',
   note:"아브람 가족은 메소포타미아 남쪽 끝 우르를 떠나 유프라테스강을 따라 북서쪽 밧단아람의 하란까지 올라가요. 아버지 데라는 하란에서 죽어요. 그 뒤 75세의 아브람은 '네 고향과 친척과 아버지의 집을 떠나, 내가 보여 줄 땅으로 가라'는 말씀을 듣고 다시 길을 나서요. 가운데 아라비아 사막은 가로질러 갈 수가 없거든요. 그래서 길은 비옥한 초승달을 따라 위로 크게 돌았다가 가나안으로 내려와요. 다 합치면 1,500km가 넘어요. 세겜에서 '이 땅을 네 자손에게 주리라'는 약속을 받고 첫 제단을 쌓은 뒤, 벧엘을 지나 남쪽 네게브로 내려가요. 다메섹을 거쳤는지는 본문에 안 나와서 점선으로 그렸어요. 그때 아브람은 자식이 없었고, 그 땅엔 이미 가나안 사람들이 살고 있었어요. 그런데 이때 받은 자손과 땅의 약속이 성경 끝까지 이어지는 큰 줄기가 돼요.",
   places:['우르','하란','다메섹','세겜','벧엘','브엘세바'],
   routes:[{who:"아브라함", color:'law', pts:['우르','하란']},{who:"다메섹 경유 (추정)", color:'law', dashed:true, pts:['하란','다메섹','세겜']},{who:"아브라함", color:'law', pts:['세겜','벧엘']},{who:"남방으로 (추정)", color:'law', dashed:true, pts:['벧엘','브엘세바']}],
   people:[{name:'아브라함', at:'세겜'}],
   events:[{at:'하란', t:"아버지 데라가 죽고, 75세 아브람이 사래와 롯을 데리고 떠남", ref:'창 11:32–12:4'},{at:'세겜', t:"모레 상수리나무 곁에서 \"이 땅을 네 자손에게 주리라\"는 약속. 첫 제단", ref:'창 12:6–7'}]},

  {week:1, id:'w1-3', title:'이집트, 롯, 소돔', ref:'창 12:10–19장', era:'BC 2090–2067경', view:'nearE', layer:'w1',
   note:"가나안에 들어온 뒤 그 땅에 흉년이 들어 아브람은 이집트로 내려가요. 거기서 아내 사래를 누이라고 속였다가 바로의 궁에서 들통나고, 다시 가나안으로 올라와요. 가축이 너무 많아져 롯과 갈라설 때, 롯은 물이 넉넉한 요단 들판의 소돔 쪽을 골라요. 아브람은 헤브론 마므레에 장막을 치고요. 얼마 뒤 엘람 왕 그돌라오멜을 비롯한 동방의 네 왕이 쳐들어와 롯을 잡아가요. 아브람은 집에서 기른 318명을 데리고 북쪽 끝 단까지, 거기서 다메섹 북쪽 호바까지 쫓아가 롯을 구해 와요. 돌아오는 길엔 살렘 왕 멜기세덱이 떡과 포도주를 들고 나와 맞아 줘요. 지도에서 아브람이 가나안을 위아래로 오르내리는 걸 보면, 약속은 받았지만 아직 땅 한 뼘 없이 장막을 옮겨 다니는 처지예요. 17장에서 이름이 아브라함으로 바뀌고, 19장에서 소돔은 하늘에서 내린 유황과 불로 망해요.",
   places:['브엘세바','멤피스','벧엘','헤브론','소돔','단','살렘'],
   routes:[{who:"이집트 왕복 (경로 추정)", color:'law', dashed:true, pts:['브엘세바','멤피스','브엘세바']},{who:"아브라함", color:'law', pts:['브엘세바','벧엘','헤브론']},
           {who:"롯", color:'law', dashed:true, pts:['벧엘','소돔']},
           {who:"롯을 구하러", color:'law', dashed:true, pts:['헤브론','단','다메섹','살렘']}],
   people:[{name:'아브라함', at:'헤브론'},{name:'롯', at:'소돔'}],
   events:[{at:'멤피스', t:"흉년에 이집트로 내려감. 본문에는 \"애굽\"이라고만 나옴. 사래를 누이라 했다 들통남 (궁 위치 추정)", ref:'창 12:10–20'},{at:'소돔', t:"롯이 고른 물 넉넉한 들판의 성. 19장에서 유황과 불로 멸망", ref:'창 13, 19장'},{at:'단', t:"318명을 이끌고 단까지, 다시 다메섹 북쪽 호바까지 쫓아가 롯을 구함", ref:'창 14:14–16'},{at:'살렘', t:"살렘 왕 멜기세덱이 떡과 포도주로 맞아 축복함", ref:'창 14:18'},{at:'헤브론', t:"마므레 상수리나무 곁에 장막. 세 손님이 찾아오고 사라가 웃음", ref:'창 13:18, 18장'}]},

  {week:1, id:'w1-4', title:'이삭의 출생과 모리아', ref:'창 20–23', era:'BC 2066–2029경', view:'canaan', layer:'w1',
   note:"아브라함은 남쪽 그랄에 머물 때 그 땅의 왕 아비멜렉에게 또 사라를 누이라고 해요. 그 땅에 머무는 동안, 약속을 받은 지 25년 만에 아들 이삭이 태어나요. 아브라함이 100세 때였어요. 이삭이라는 이름은 '웃음'이라는 뜻이고요. 그 뒤 브엘세바에서 아비멜렉과 우물을 두고 맹세를 해요. 그러던 어느 날 아브라함은 하나님 말씀을 따라 사흘 길을 걸어 모리아 땅으로 가요. 거기서 이삭을 바치려다 마지막 순간에 숫양을 대신 드려요. 모리아 산은 전통적으로 훗날 예루살렘 성전이 서는 자리로 봐서, 지도에는 살렘에 표시했어요. 사라가 127세에 헤브론에서 죽자 아브라함은 은 400세겔을 주고 막벨라 굴을 사요. 약속의 땅에서 아브라함이 처음으로 산 땅이 이 가족 무덤이었어요.",
   places:['그랄','브엘세바','살렘','헤브론'],
   routes:[{who:"아브라함", color:'law', pts:['헤브론','그랄','브엘세바']},{who:"모리아로, 사흘 길", color:'law', dashed:true, pts:['브엘세바','살렘']}],
   people:[{name:'아브라함·이삭', at:'브엘세바'}],
   events:[{at:'그랄', t:"아비멜렉에게 또 사라를 누이라 함. 여기 머물 때 이삭 출생 (아브라함 100세)", ref:'창 20:1–21:7'},{at:'브엘세바', t:"하갈과 이스마엘을 브엘세바 광야로 내보냄. 아비멜렉과 우물 맹세", ref:'창 21:8–34'},{at:'살렘', t:"모리아 산, 이삭 대신 숫양을 드림. \"여호와 이레\" (전통적 위치)", ref:'창 22장'},{at:'헤브론', t:"사라가 127세에 죽음. 은 400세겔에 막벨라 굴을 삼", ref:'창 23장'}]},

  {week:1, id:'w1-5', title:'야곱의 도망', ref:'창 24–29', era:'BC 1930경', view:'haran', layer:'w1',
   note:"아브라함은 늙은 종을 고향 쪽으로 보내 이삭의 아내 리브가를 데려와요. 리브가는 밧단아람에 살던 아브라함의 형제 나홀의 손녀예요. 지도에는 리브가가 온 길을 브엘세바까지 그렸지만, 그때 이삭은 그 근처 브엘라해로이에 살고 있었어요. 결혼하고 20년 뒤에 쌍둥이 에서와 야곱이 태어나요. 동생 야곱은 팥죽 한 그릇으로 형의 장자권, 그러니까 맏아들 몫을 사요. 나중엔 눈이 어두운 아버지를 속여 축복까지 가로채고요. 형이 죽이겠다고 벼르자 야곱은 어머니 말대로 외삼촌 라반이 사는 하란으로 도망쳐요. 가는 길에 벧엘에서 하늘까지 닿은 사다리 꿈을 꾸고, '내가 너와 함께 있어 너를 이 땅으로 다시 데려오겠다'는 약속을 들어요. 며칠만 가 있으라던 길이 20년이 돼요. 그동안 야곱은 레아와 라헬과 결혼해 열한 아들을 얻어요. 막내 베냐민은 돌아오는 길에 태어나죠. 지도 아래쪽 세일은 에서가 훗날 자리 잡아 에돔이 되는 땅이에요.",
   places:['브엘세바','벧엘','하란','세일'],
   routes:[{who:"야곱", color:'hist', pts:['브엘세바','벧엘']},{who:"야곱 (경로 추정)", color:'hist', dashed:true, pts:['벧엘','세겜','다메섹','하란']},{who:"리브가 (근사)", color:'hist', dashed:true, pts:['하란','브엘세바']}],
   people:[{name:'야곱', at:'하란'}],
   events:[{at:'하란', t:"리브가의 고향. 야곱이 라반 밑에서 20년을 지내며 레아, 라헬과 결혼", ref:'창 24, 29–31장'},{at:'벧엘', t:"돌베개를 베고 꾼 사다리 꿈. \"내가 너와 함께 있다\"", ref:'창 28장'},{at:'브엘세바', t:"이삭의 집. 야곱이 축복을 가로채고 떠남 (팥죽 사건 장소는 모름)", ref:'창 26:23–28:10'},{at:'세일', t:"에서가 훗날 자리 잡는 땅. 야곱이 돌아올 때는 이미 여기 있었음", ref:'창 32:3, 36:6–8'}]},

  {week:1, id:'w1-6', title:'야곱의 귀향, 이스라엘', ref:'창 31–35', era:'BC 1910경', view:'haran', layer:'w1',
   note:"20년 만에 야곱은 가족과 가축을 이끌고 몰래 하란을 떠나요. 뒤쫓아 온 라반과는 길르앗 산지에서 돌무더기를 쌓고 화해하고요. 하란에서 여기까지 어느 길로 왔는지는 본문에 없어서 점선으로 그렸어요. 문제는 앞쪽이었어요. 20년 전에 자기를 죽이겠다던 형 에서가 400명을 데리고 오고 있었거든요. 두려운 마음으로 혼자 남은 밤, 야곱은 얍복 강가에서 어떤 사람과 날이 새도록 씨름하고 이스라엘이라는 새 이름을 받아요. 한 사람의 이름이 나중에 민족과 나라의 이름이 되는 순간이에요. 다음 날 에서는 달려와 야곱을 끌어안고, 그날로 세일로 돌아가요. 야곱은 세겜과 벧엘을 거쳐 남쪽으로 내려가요. 베들레헴 가는 길에 라헬이 막내 베냐민을 낳다가 죽고, 야곱은 마침내 헤브론에서 아버지 이삭을 다시 만나요.",
   places:['하란','브니엘','세겜','벧엘','베들레헴','헤브론','세일'],
   routes:[{who:"야곱 (다메섹 경유 추정)", color:'hist', dashed:true, pts:['하란','다메섹','브니엘']},{who:"야곱", color:'hist', pts:['브니엘','세겜','벧엘','베들레헴','헤브론']},{who:"에서", color:'hist', dashed:true, pts:['세일','브니엘']}],
   people:[{name:'야곱', at:'브니엘'},{name:'에서', at:'세일'}],
   events:[{at:'브니엘', t:"얍복 강가에서 밤새 씨름, 이름이 이스라엘로. 이튿날 에서와 화해", ref:'창 32장'},{at:'세겜', t:"땅을 사고 제단을 쌓음. 딸 디나가 욕을 당하고 형들이 복수함", ref:'창 33:18–34장'},{at:'벧엘', t:"다시 벧엘로 올라가 제단을 쌓음. 이스라엘이라는 이름을 다시 받음", ref:'창 35장'},{at:'베들레헴', t:"라헬이 베냐민을 낳다 죽어 베들레헴 길에 묻힘", ref:'창 35:16–20'},{at:'헤브론', t:"아버지 이삭을 다시 만남. 이삭은 180세에 죽는데, 요셉이 팔린 뒤의 일", ref:'창 35:27–29'}]},

  {week:1, id:'w1-7', title:'요셉, 도단에서 이집트로', ref:'창 37–40', era:'BC 1898경', view:'nearE', layer:'w1',
   note:"열일곱 살 요셉은 아버지 야곱이 유난히 아끼는 아들이었어요. 아버지한테 채색옷을 받은 데다 형들이 자기에게 절하는 꿈 얘기까지 하니, 형들이 미워할 수밖에 없었죠. 아버지 심부름으로 헤브론에서 세겜까지 형들을 찾아갔는데, 형들은 더 북쪽 도단으로 옮겨 가 있었어요. 요셉은 거기서 구덩이에 던져졌다가 은 20에 팔려요. 요셉을 산 이스마엘·미디안 상인들은 낙타에 향품을 싣고 이집트로 내려가던 길이었어요. 아마 바닷가 가사 쪽 길로 갔을 거라고 보고, 지도엔 점선으로 그렸어요. 이집트에서 요셉은 바로의 친위대장 보디발의 집 종이 됐다가 억울한 누명을 쓰고 감옥에 갇혀요. 감옥에서 바로의 술 맡은 관원과 떡 굽는 관원의 꿈을 풀어 주지만, 금세 잊히고 말아요. 그렇게 13년이 흘러요. 그런데 이 길이 나중에 온 가족을 이집트로 데려가는 길이 돼요.",
   places:['헤브론','세겜','도단','가사','고센','멤피스'],
   routes:[{who:"요셉", color:'gosp', pts:['헤브론','세겜','도단']},{who:"상인들 (해안 길 추정)", color:'gosp', dashed:true, pts:['도단','가사','고센','멤피스']}],
   people:[{name:'요셉', at:'멤피스'},{name:'야곱', at:'헤브론'}],
   events:[{at:'도단', t:"형들이 구덩이에 던졌다가 상인들에게 은 20에 팖", ref:'창 37장'},{at:'멤피스', t:"보디발의 집 종살이, 억울한 감옥살이, 두 관원의 꿈 풀이 (바로의 궁 부근 추정)", ref:'창 39–40장'}]},

  {week:1, id:'w1-8', title:'바로의 꿈, 가족의 이주', ref:'창 41–50', era:'BC 1885–1805', view:'nearE', layer:'w1',
   note:"2년이 더 지나 요셉은 바로의 꿈을 풀어요. 7년 큰 풍년 뒤에 7년 흉년이 온다는 꿈이었죠. 요셉은 서른 살에 이집트의 총리가 돼요. 흉년이 가나안까지 덮치자 형들이 곡식을 사러 두 번 내려오고, 요셉은 끝내 '내가 요셉입니다' 하고 자기를 밝혀요. 야곱은 브엘세바에서 제사를 드리고 '두려워 말라, 거기서 큰 민족을 이루겠다'는 말씀을 들어요. 그러고는 70명 가족을 이끌고 내려가 나일 삼각주 동쪽 고센에 자리 잡아요. 17년 뒤 야곱이 죽자, 유언대로 긴 장례 행렬이 가나안 헤브론의 막벨라 굴까지 올라가요. 요셉은 110세에 죽으면서 '하나님이 반드시 여러분을 이 땅에서 이끌어 내실 테니, 그때 내 뼈를 메고 올라가라'고 맹세시켜요. 창세기는 이렇게 이집트에 남은 관 하나로 끝나요. 다음 주가 되면 이 70명이 큰 민족이 되어 있어요.",
   places:['헤브론','브엘세바','고센','온','멤피스'],
   routes:[{who:"형들 (곡식 사러)", color:'gosp', dashed:true, pts:['헤브론','멤피스']},{who:"야곱 가족 70명", color:'hist', pts:['헤브론','브엘세바','고센']},{who:"장례 행렬 (아닷 경유, 창 50:10)", color:'hist', dashed:true, pts:['고센','헤브론']}],
   people:[{name:'요셉', at:'멤피스'},{name:'야곱 가족', at:'고센'}],
   events:[{at:'멤피스', t:"바로의 꿈을 풀고 30세에 총리. 곡식 사러 온 형들과 재회 (궁 위치 추정)", ref:'창 41–45장'},{at:'온', t:"요셉의 아내 아스낫은 온의 제사장 보디베라의 딸", ref:'창 41:45'},{at:'브엘세바', t:"이집트로 가기 전 드린 제사. \"두려워 말라, 거기서 큰 민족을 이루리라\"", ref:'창 46:1'},{at:'고센', t:"70명 정착. 야곱은 17년 더 살다 147세에 죽음. 요셉은 110세에 죽음", ref:'창 46–50장'},{at:'헤브론', t:"유언대로 야곱을 아브라함과 이삭 곁, 막벨라 굴에 장사함", ref:'창 50장'}]},

  {week:1, id:'w1-9', title:'욥의 땅, 우스', ref:'욥기', era:'족장 시대로 봄', view:'uz', layer:'w1',
   note:"욥기의 배경은 우스 땅인데, 정확히 어딘지는 확실하지 않아요. 친구 엘리바스가 에돔의 데만 사람이라서 에돔 동쪽이나 북아라비아로 보는 경우가 많아요. 지도에는 세일 동쪽에 추정 위치로 찍어 두었어요. 욥은 아들 일곱, 딸 셋에 양 7,000마리, 낙타 3,000마리를 가진 '동방 사람 중에 가장 훌륭한 자'였어요. 재산을 가축으로 세고, 제사장 없이 가장이 직접 제사를 드려요. 율법이나 성전 이야기는 한 번도 안 나오고요. 그래서 아브라함 무렵, 족장 시대 이야기로 봐요. 성경 순서로는 한가운데쯤 있는 책이지만, 시간 순서로 놓으면 여기 창세기 옆이에요.",
   places:['우스','세일'], routes:[], people:[{name:'욥', at:'우스'}],
   events:[{at:'우스', t:"욥의 고향. 모든 것을 잃고 친구들과 논쟁하다 회복됨 (위치 추정)", ref:'욥 1:1'},{at:'세일', t:"친구 엘리바스는 에돔의 데만 사람. 우스를 에돔 쪽으로 보는 근거", ref:'욥 2:11'}]},

  {week:2, id:'w2-0', title:'400년 뒤의 이집트', ref:'출 1–4', era:'BC 1526–1446', view:'sinai', layer:'w2',
   note:"1주 차 마지막에 야곱 가족 70명이 이집트로 내려갔죠. 이제 그로부터 400년쯤 지난 때예요. 성경은 이스라엘이 이집트에서 산 기간을 430년이라고 해요. 그사이 요셉을 모르는 새 왕이 일어나는데, 새 왕조가 들어선 걸로 보기도 해요. 큰 민족이 된 이스라엘은 고센에서 노예가 되어 국고성 비돔과 라암셋을 짓게 돼요. 모세는 나일강에서 건져져 바로의 딸의 아들로 자랐어요. 40세에 이집트 사람을 죽이고 미디안으로 도망쳐 40년을 양치기로 살다가, 호렙 산 떨기나무 앞에서 부르심을 받아요. 지도를 보면 서쪽의 큰 땅이 이집트예요. 지중해 동쪽 해안은 앞으로 들어갈 가나안인데, 이때는 이집트 밑에 있는 작은 도시국가들이었어요. 그 사이 시내 반도 남쪽이 율법을 받게 될 시내 광야고, 아카바만 건너편이 모세가 숨어 지낸 미디안이에요. 사해 동쪽으로는 위에서부터 암몬과 모압이 있는데, 둘 다 롯의 자손이에요. 그 아래 에돔은 에서의 자손이고요. 가나안 남쪽 광야의 아말렉은 이스라엘이 처음으로 맞서 싸우게 될 민족이에요. 멀리 북쪽과 동쪽에도 나라들이 있어요. 북쪽의 히타이트는 아직 대제국이 되기 전이고(BC 1350년쯤부터 커져요), 유프라테스강 상류에는 강국 미탄니, 그 밑에 눌려 있던 앗수르, 남쪽 두 강 사이에는 바벨론이 있어요. 전통 연대로 출애굽은 BC 1446년이에요. 이때 이집트는 신왕국 18왕조의 전성기였고, 투트모세 3세에서 아멘호텝 2세로 넘어가던 무렵으로 봐요.",
   places:['고센','멤피스','미디안','시내산'],
   routes:[{who:"모세 피신 (추정 경로)", color:'proph', dashed:true, pts:['고센','에시온게벨','미디안']},{who:"부르심 받고 돌아옴", color:'proph', pts:['미디안','시내산','고센']}],
   people:[{name:'모세', at:'시내산'},{name:'이스라엘', at:'고센'}],
   events:[{at:'고센', t:"노예가 된 이스라엘이 국고성 비돔과 라암셋을 지음. 재앙 때 고센은 여러 번 비껴감", ref:'출 1:11, 7–12장, 8:22, 9:26'},{at:'미디안', t:"모세가 도망쳐 40년을 지낸 곳. 이드로의 딸 십보라와 결혼하고 양을 침", ref:'출 2장'},{at:'시내산', t:"호렙 산 떨기나무에서 \"내 백성을 애굽에서 인도하여 내라\"는 부르심. 돌아오는 길에 여기서 아론을 만남", ref:'출 3:1–10, 4:27'}]},

  {week:2, id:'w2-1', title:'출애굽과 홍해', ref:'출 12–15', era:'BC 1446', view:'sinai', layer:'w2',
   note:"유월절 밤, 마지막 재앙이 내린 뒤 이스라엘은 드디어 고센을 떠나요. 가나안으로 가는 가장 빠른 길은 지중해 해안을 따라 가사까지 곧장 올라가는 길이었어요. 성경은 이 길을 \"블레셋 땅 길\"이라고 부르는데, 블레셋 사람들은 200년쯤 뒤에야 들어오는 민족이라 이 지도에는 아직 안 나와요. 하나님은 백성이 전쟁을 만나면 겁먹고 이집트로 돌아갈까 봐 이 길 대신 광야 길로 돌려 보내세요. 숙곳과 에담을 지나 바다 앞에 진을 쳤는데, 바로의 전차 부대가 뒤쫓아 와요. 그때 홍해가 갈라지죠. 건넌 곳은 전통적으로 수에즈만 북쪽 끝 언저리로 보지만, 아카바만이라는 설도 있어요. 바다를 건넌 뒤에는 물이 써서 마실 수 없던 마라를 지나, 샘 열두 개와 종려나무 일흔 그루가 있는 엘림에 이르러요.",
   places:['고센','숙곳','홍해 횡단','마라','엘림','가사'],
   routes:[{who:"이스라엘", color:'proph', pts:['고센','숙곳','홍해 횡단','마라','엘림']},{who:"해안 길 (피함)", color:'proph', dashed:true, pts:['고센','가사']}],
   people:[{name:'모세와 이스라엘', at:'홍해 횡단'}],
   events:[{at:'고센', t:"유월절 밤, 마지막 재앙 뒤 그 밤으로 서둘러 출발", ref:'출 12장'},{at:'홍해 횡단', t:"바다가 갈라져 마른 땅으로 건넘. 뒤쫓던 바로의 군대는 물에 잠김", ref:'출 14장'},{at:'마라', t:"물이 써서 못 마심. 모세가 나무를 던지자 단물이 됨", ref:'출 15:22–25'},{at:'엘림', t:"샘 열두 개와 종려나무 일흔 그루가 있는 곳. 물가에 진을 침", ref:'출 15:27'}]},

  {week:2, id:'w2-2', title:'시내산, 십계명과 성막', ref:'출 16–40 · 레위기 · 민 1–10', era:'BC 1446–1445', view:'sinai', layer:'w2',
   note:"엘림을 떠나 신 광야에 들어서자 먹을 게 떨어져요. 그러자 하나님이 만나와 메추라기를 주세요. 르비딤에서는 마실 물이 없어서 모세가 반석을 쳐 물을 내고, 곧이어 아말렉과 첫 전투를 벌여요. 모세가 손을 들고 있으면 이스라엘이 이기고 내리면 밀렸대요. 그래서 아론과 훌이 양쪽에서 모세의 손을 붙들어 올려 줘요. 출애굽 후 셋째 달에 시내 광야에 도착해 시내산 앞에 진을 치고, 여기서 거의 1년을 머물러요. 십계명과 언약을 받은 것도, 금송아지 사건도, 성막을 완성한 것도 다 여기서예요. 출애굽기 후반부와 레위기 전체, 민수기 앞부분이 모두 이 한자리에서 있었던 일이거든요. 시내산은 전통적으로 시내 반도 남쪽의 예벨 무사로 보는데, 다른 후보들도 있어서 확실하지는 않아요.",
   places:['엘림','르비딤','시내산'],
   routes:[{who:"이스라엘", color:'proph', pts:['엘림','르비딤','시내산']}],
   people:[{name:'이스라엘 (1년)', at:'시내산'}],
   events:[{at:'르비딤', t:"물이 없자 모세가 반석을 쳐 물을 냄. 아말렉과의 첫 전투에서 모세가 손을 들고 있음", ref:'출 17장'},{at:'시내산', t:"십계명과 언약, 금송아지 사건, 성막 완성. 레위기의 규정들도 여기서 받음", ref:'출 19–40, 레위기'}]},

  {week:2, id:'w2-3', title:'가데스바네아, 그리고 38년', ref:'민 10–25', era:'BC 1445–1407', view:'wander', layer:'w2',
   note:"시내산을 떠난 이스라엘은 바란 광야의 가데스바네아에 와서 가나안으로 정탐꾼 열두 명을 보내요. 이들은 40일 동안 남쪽 헤브론을 거쳐 북쪽 끝 르홉까지 둘러보고, 두 사람이 장대에 메야 할 만큼 큰 포도송이를 들고 돌아와요. 그런데 열 명은 \"그 땅 사람들이 너무 강해서 못 들어간다\"고 하고, 여호수아와 갈렙 두 사람만 \"들어갈 수 있다\"고 해요. 백성은 밤새 울면서 이집트로 돌아가자고 하죠. 결국 그 세대는 광야에서 죽고 자녀 세대가 들어가는 걸로 정해져요. 그렇게 38년을 가데스와 세일 산 둘레 광야에서 맴돌아요. 그 뒤에는 에돔이 길을 내주지 않아서, 아론이 죽은 호르산을 거쳐 에돔 땅을 빙 돌아가요. 아르논 골짜기를 건너서는 아모리 왕 시혼과 바산 왕 옥을 꺾고요. 그리고 마침내 요단강을 사이에 두고 여리고 맞은편, 모압 평지에 이르러요.",
   places:['시내산','가데스바네아','헤브론','르홉','호르산','에시온게벨','아르논','헤스본','에드레이','모압 평지'],
   routes:[{who:"이스라엘", color:'proph', pts:['시내산','가데스바네아']},
           {who:"정탐꾼 40일", color:'proph', dashed:true, pts:['가데스바네아','헤브론','세겜','르홉']},
           {who:"에돔 우회", color:'proph', pts:['가데스바네아','호르산','에시온게벨','아르논','헤스본','에드레이','모압 평지']}],
   people:[{name:'이스라엘 (38년)', at:'가데스바네아'}],
   events:[{at:'가데스바네아', t:"정탐꾼 열두 명을 보냈지만 백성이 믿지 못해 40년 광야 생활이 선고됨. 미리암이 죽고, 모세가 반석을 침", ref:'민 13–14, 20장'},{at:'헤브론', t:"정탐꾼들이 둘이 메야 할 만큼 큰 포도송이를 꺾은 에스골 골짜기", ref:'민 13:22–24'},{at:'호르산', t:"아론이 죽고, 아들 엘르아살이 대제사장 옷을 이어받음", ref:'민 20:22–29'},{at:'에시온게벨', t:"에돔이 길을 막아 홍해 길로 돌아감. 놋뱀 사건은 이 길 어딘가에서 일어남 (장소 추정)", ref:'민 20:14–21, 21:4–9, 신 2:8'},{at:'헤스본', t:"아모리 왕 시혼의 도성. 시혼을 꺾고 그 땅을 차지함", ref:'민 21:21–31'},{at:'에드레이', t:"바산 왕 옥과 싸워 이김", ref:'민 21:33–35'},{at:'모압 평지', t:"모압 왕 발락이 발람을 불러 저주하게 하고, 말하는 나귀가 나옴. 싯딤에서는 바알브올 사건", ref:'민 22–25장'}]},

  {week:2, id:'w2-4', title:'모압 평지, 모세의 고별', ref:'신명기', era:'BC 1406', view:'jordan', layer:'w2',
   note:"이스라엘은 요단강 동쪽 모압 평지에 진을 쳐요. 강 건너편이 여리고고, 그 너머가 가나안이에요. 모세는 여기서 광야에서 나고 자란 새 세대에게 지난 40년을 되짚어 주고, 율법을 다시 풀어서 들려줘요. 신명기 전체가 이 자리에서 한 고별 설교예요. \"들으라 이스라엘아\"로 시작하는 쉐마도 여기서 나오고요. 모세는 가데스에서 반석을 친 일 때문에 약속의 땅에 못 들어간다는 말씀을 이미 들었어요. 그래서 여호수아를 후계자로 세우고, 느보산에 올라 그 땅을 멀리 바라본 뒤 120세로 죽어요. 하나님이 그를 모압 땅 골짜기에 묻으셨는데, 그 무덤이 어디인지는 지금까지 아무도 몰라요.",
   places:['모압 평지','느보산','여리고','헤스본'],

  {week:2, id:'w2-5', title:'요단강과 여리고', ref:'수 1–8', era:'BC 1406', view:'jordan', layer:'w2',

   note:"가까이 살던 기브온 사람들이 낡은 옷과 곰팡이 핀 빵으로 먼 나라에서 온 척 속여서 이스라엘과 동맹을 맺어요. 이스라엘은 하나님께 묻지도 않고 맹세해 버렸기 때문에, 속은 걸 알고 나서도 그 약속을 지켜요. 그러자 예루살렘 왕을 비롯한 남부의 다섯 왕이 기브온을 치러 와요. 여호수아는 길갈에서 밤새 올라가 기브온을 구하죠. 이때 여호수아가 \"태양아 너는 기브온 위에 머무르라 달아 너는 아얄론 골짜기에서 그리할지어다\" 하고 외치자 해와 달이 멈춰요. 이어서 라기스와 헤브론 같은 가나안 남부 성읍들을 하나씩 무너뜨리고 길갈로 돌아와요. 그 뒤 북쪽에서는 하솔 왕 야빈이 연합군을 모으는데, 이스라엘이 메롬 물가에서 이들을 꺾고 하솔을 불태워요. 이 전쟁은 6년이나 7년쯤 걸린 걸로 봐요. 정탐 때 40세였던 갈렙이 땅을 나눌 때 85세라고 말하거든요.",

    {at:'헤브론', t:"아버지 이삭 곁에 자리 잡음. 요셉이 죽은 줄 알고 통곡", ref:'창 35:27, 37:1–35'},
    {at:'브엘세바', t:"이집트로 내려가기 전에 제사를 드리고 \"두려워하지 마라\"는 말씀을 들음", ref:'창 46:1–4'},
    {at:'고센', t:"70명과 함께 정착. 17년을 더 살다가 147세에 죽음", ref:'창 46:28–47:12, 47:28, 49:33'},
    {at:'헤브론', t:"긴 장례 행렬 끝에 막벨라 굴에 묻힘", ref:'창 50:1–13', est:true}]},

  {f:'isaac', m:'rebekah', g:'아브라함 집안', id:'esau', name:'에서', color:'hist', layer:'w1', why:"야곱의 쌍둥이 형이자 에돔 족속의 조상", era:'BC 2006경',
   note:"먼저 태어난 쌍둥이 형이에요. 장자권을 팥죽 한 그릇에 팔고, 아버지의 축복까지 야곱에게 빼앗기죠. 그런데도 20년 뒤 돌아온 동생에게 달려가 끌어안아요. 나중에 세일 산에 자리 잡고 에돔 족속의 조상이 돼요.",
   steps:[
    {at:'브엘세바', t:"먼저 나온 쌍둥이 형 (출생은 브엘라해로이 근처, 위치 근사). 팥죽 사건, 축복을 빼앗기고 통곡", ref:'창 25:11, 25:25–34, 27:30–41', est:true},
    {at:'세일', t:"야곱이 돌아올 무렵엔 이미 세일 땅 에돔 들에서 살고 있었음", ref:'창 32:3'},
    {at:'브니엘', t:"400명을 데리고 왔지만 달려가 야곱을 끌어안음. 그날 바로 세일로 돌아감", ref:'창 32:6, 33:1–4, 33:16'},
    {at:'헤브론', t:"야곱과 함께 아버지 이삭을 장사 지냄", ref:'창 35:29'},
    {at:'세일', t:"재산이 많아 야곱과 떨어져 세일 산에 정착. 자손이 에돔 족속이 됨", ref:'창 36:6–8, 36:9–43'}]},

  {f:'jacob', m:'rachel', s:['asenath'], g:'야곱의 열두 아들', id:'joseph', name:'요셉', color:'gosp', layer:'w1', why:"형들 손에 팔려 가 이집트 총리가 되고, 결국 가족을 살린 사람. 이집트 430년의 시작", era:'BC 1915–1805',
   note:"17세에 형들에게 팔려 가서 30세에 이집트 총리가 되고, 110세에 죽어요. 관은 그대로 이집트에 있다가 360년쯤 지나(BC 1805 → 1446) 출애굽 때 이스라엘 백성이 메고 나와요. 정복이 끝난 뒤에야 세겜에 묻히죠.",
   steps:[
    {at:'하란', t:"야곱이 하란에 있을 때 라헬에게서 태어남", ref:'창 30:22–24'},
    {at:'헤브론', t:"17세. 아버지가 지어 준 채색옷과 꿈 이야기", ref:'창 37:1–11'},
    {at:'세겜', t:"아버지 심부름으로 형들을 찾아 나섬", ref:'창 37:12–14'},
    {at:'도단', t:"형들이 구덩이에 던졌다가 은 20에 팔아넘김", ref:'창 37:17–28'},
    {at:'멤피스', t:"보디발의 집, 감옥, 바로의 꿈 해석을 거쳐 30세에 총리가 됨 (궁 위치 추정)", ref:'창 39–41장', est:true},
    {at:'고센', t:"수레를 타고 올라가 아버지를 맞음", ref:'창 46:28–29'},
    {at:'헤브론', t:"아버지 장례를 치르러 올라옴", ref:'창 50:7–13'},
    {at:'멤피스', t:"110세에 죽음. 몸에 향 재료를 넣어 입관 (위치 추정)", ref:'창 50:22–26', est:true},
    {at:'세겜', t:"출애굽 때 이스라엘이 뼈를 메고 나왔고, 정복 뒤 세겜에 묻힘", ref:'출 13:19, 수 24:32', est:true}]},

  {g:'족장 시대 (추정)', id:'job', name:'욥', color:'poet', layer:'w1', why:"족장 시대 사람으로 보는 의인. \"착한 사람이 왜 고난을 받을까\"를 묻는 욥기의 주인공", era:'족장 시대로 봄',
   note:"우스 땅 사람이에요. 우스가 어딘지는 확실하지 않은데, 에돔 동쪽이나 북아라비아 쪽으로 보는 경우가 많아요. 옮겨 다닌 기록이 없어서 지도에는 점 하나로만 찍혀 있어요.",
   steps:[
    {at:'우스', t:"모든 것을 잃고 친구들과 길게 논쟁한 끝에, 폭풍 속에서 하나님을 만나고 회복됨", ref:'욥 1–42장', est:true}]},

  {f:'amram', m:'jochebed', s:['zipporah'], g:'출애굽 세대', id:'moses', name:'모세', color:'proph', layer:'w2', why:"이스라엘을 이집트에서 이끌어 내고 율법을 받은 사람. 전통적으로 오경을 쓴 사람으로 봄", era:'BC 1526–1406',
   note:"이집트 궁에서 40년, 미디안에서 40년을 보내고, 백성을 이끌고 광야에서 다시 40년을 보내요. 120세에 느보산에 올라 약속의 땅을 바라보기만 하고, 끝내 들어가지 못한 채 모압 땅에서 죽죠.",
   steps:[
    {at:'고센', t:"태어나 석 달을 숨겨 키우다 갈대 상자에 담겼고, 바로의 딸이 건져 냄 (이스라엘이 살던 고센으로 봄)", ref:'출 2:1–10, 9:26, 창 47:27'},
    {at:'멤피스', t:"바로의 궁에서 자람 (위치 추정). 40세에 이집트 사람을 죽이고 도망", ref:'출 2:11–15, 행 7:22–23', est:true},
    {at:'미디안', t:"40년 동안 피신. 이드로의 딸 십보라와 결혼", ref:'출 2:15–22, 행 7:29–30', est:true},
    {at:'시내산', t:"호렙 산, 불붙은 떨기나무에서 부르심을 받음", ref:'출 3:1–4:17'},
    {at:'고센', t:"바로 앞에서 열 재앙. 첫 유월절", ref:'출 5–12장'},
    {at:'홍해 횡단', t:"갈라진 바다를 건넘 (전통적 위치)", ref:'출 14장', est:true},
    {at:'르비딤', t:"반석에서 물이 나옴. 아말렉과 싸움 (위치 추정)", ref:'출 17장', est:true},
    {at:'시내산', t:"십계명, 금송아지, 성막. 1년쯤 머묾", ref:'출 19–40장, 민 10:11'},
    {at:'가데스바네아', t:"열두 정탐꾼과 40년 광야 선고. 반석을 친 일 때문에 가나안에 못 들어가게 됨", ref:'민 13–14장, 20:1–13'},
    {at:'호르산', t:"형 아론이 죽음 (전통적 위치)", ref:'민 20:22–29', est:true},
    {at:'에시온게벨', t:"에돔 땅을 돌아 홍해 길로. 놋뱀을 장대에 매닮", ref:'민 21:4–9, 신 2:8', est:true},
    {at:'헤스본', t:"아모리 왕 시혼을 이김", ref:'민 21:21–31'},
    {at:'에드레이', t:"바산 왕 옥을 이김", ref:'민 21:33–35'},
    {at:'모압 평지', t:"발람 사건. 신명기의 고별 설교를 하고 여호수아를 후계자로 세움", ref:'민 22–25장, 신 1–33장'},
    {at:'느보산', t:"약속의 땅을 바라본 뒤 120세에 죽음", ref:'신 34:1–7'}]},

  {f:'nun', g:'출애굽 세대', id:'joshua', name:'여호수아', color:'poet', layer:'w2', why:"모세의 뒤를 이어 가나안 정복과 땅 분배를 이끈 사람", era:'지도자 BC 1406–1380경 (출애굽 때부터 활동)',
   note:"이집트에서 태어나 모세의 수종자로 늘 곁에 있던 사람이에요. 정탐꾼으로 갔을 때 갈렙과 함께 \"들어갈 수 있다\"고 했죠. 모세가 죽은 뒤 요단을 건너 정복과 땅 분배를 이끌었고, 마지막에는 세겜에 백성을 모아 고별 연설을 한 뒤 110세에 죽어요.",
   steps:[
    {at:'고센', t:"이집트에서 태어난 에브라임 지파 사람 (출애굽 세대)", ref:'민 13:8, 16', est:true},
    {at:'르비딤', t:"아말렉과의 전투를 지휘 (위치 추정)", ref:'출 17:8–13', est:true},
    {at:'시내산', t:"모세의 수종자로 산에 함께 오름", ref:'출 24:13, 32:17'},
    {at:'가데스바네아', t:"열두 정탐꾼 중 하나. 갈렙과 함께 \"들어갈 수 있다\"고 함", ref:'민 13:8, 14:6–9'},
    {at:'모압 평지', t:"모세에게 안수받고 후계자가 됨", ref:'민 27:18–23, 신 31:7–8'},
    {at:'길갈', t:"요단을 건너 진을 침. 할례를 행하고 유월절을 지킴", ref:'수 3–5장'},
    {at:'여리고', t:"7일 동안 성을 돌자 성벽이 무너짐", ref:'수 6장'},
    {at:'아이', t:"아간의 죄 때문에 한 번 졌다가 다시 싸워 이김", ref:'수 7–8장'},
    {at:'세겜', t:"에발산과 그리심산 앞에서 율법을 읽음", ref:'수 8:30–35'},
    {at:'기브온', t:"기브온에 속아 동맹을 맺고 다섯 왕과 싸움. 해가 멈춤", ref:'수 9–10장'},
    {at:'라기스', t:"남쪽 성읍들을 정복", ref:'수 10:28–43'},
    {at:'하솔', t:"메롬 물가에서 북쪽 왕들의 연합군과 싸움", ref:'수 11장'},
    {at:'실로', t:"성막을 세우고 지파들에게 땅을 나눔", ref:'수 18장'},
    {at:'세겜', t:"고별 연설. \"나와 내 집은 여호와를 섬기겠노라\"", ref:'수 24:1–28'},
    {at:'딤낫세라', t:"110세에 죽어 자기가 받은 땅에 묻힘", ref:'수 24:29–30'}]},

  {f:'jephunneh', g:'출애굽 세대', id:'caleb', name:'갈렙', color:'poet', layer:'w2', why:"열두 정탐꾼 중 믿음을 보인 두 사람 가운데 하나. 85세에 헤브론을 받음", era:'BC 1446–1400경 활동',
   note:"열두 정탐꾼 가운데 여호수아와 함께 \"들어갈 수 있다\"고 했던 사람이에요. 45년이 지나 85세가 됐을 때, 그때 직접 밟았던 헤브론 땅을 달라고 해서 받아요.",
   steps:[
    {at:'가데스바네아', t:"40세. 유다 지파 대표로 정탐에 나섬", ref:'민 13:6, 수 14:7'},
    {at:'헤브론', t:"에스골 골짜기까지 정탐. 포도 한 송이를 둘이서 막대기에 메고 옴", ref:'민 13:22–24'},
    {at:'가데스바네아', t:"\"올라가서 차지하자\"고 했다가 돌에 맞을 뻔함", ref:'민 13:30, 14:6–10'},
    {at:'길갈', t:"85세에 여호수아를 찾아가 헤브론을 달라고 함", ref:'수 14:6–12'},
    {at:'헤브론', t:"아낙 자손을 쫓아내고 헤브론을 차지함", ref:'수 14:13–15, 15:13–14'}]},

  {g:'출애굽 세대', id:'israel', name:'이스라엘 백성', color:'proph', layer:'w2', why:"야곱의 자손 전체. 70명이 한 민족이 되기까지의 길", era:'BC 1876–1400',
   note:"야곱 집안 70명이 이집트로 내려가 430년을 사는 동안, 장정만 60만 명인 민족으로 불어나요. 출애굽 뒤에는 광야에서 40년을 보내고 요단을 건너 가나안에 들어가죠. 한 사람이 아니라 민족 전체가 걸어간 길이에요.",
   steps:[
    {at:'헤브론', t:"요셉이 팔려 갈 무렵의 야곱 집안", ref:'창 37:1, 14'},
    {at:'고센', t:"70명이 내려와 430년을 삶. 노예가 됐지만 장정만 60만 명으로 불어남", ref:'창 46:27, 출 1:7–14, 12:37–41'},
    {at:'숙곳', t:"이집트를 떠나 처음 진을 친 곳 (위치 추정)", ref:'출 12:37', est:true},
    {at:'홍해 횡단', t:"바다를 건넘 (전통적 위치)", ref:'출 14장', est:true},
    {at:'시내산', t:"시내산 언약과 성막. 1년쯤 머묾", ref:'출 19장–민 10장'},
    {at:'가데스바네아', t:"정탐 보고를 믿지 않아 38년을 광야에서 보냄", ref:'민 13–14장, 신 2:14'},
    {at:'모압 평지', t:"광야에서 자란 새 세대가 모세의 고별 설교를 들음", ref:'민 22:1, 신명기'},
    {at:'길갈', t:"요단을 건너 가나안에 들어감", ref:'수 3–4장'},
    {at:'실로', t:"성막을 두고 땅을 나눔. 사사 시대의 중심지", ref:'수 18:1'}]},

  // ---- 족보로 이어지는 인물들 (여정 없음). g = 묶음 ----
  {id:'adam', name:'아담', g:'창조에서 홍수까지', era:'930세', extra:'eden', why:"흙으로 빚어진 첫 사람이에요. 에덴동산에 살았는데, 먹지 말라던 열매를 먹고 쫓겨났어요. 창세기 5장 족보가 아담에서 시작하죠.", ref:'창 2–3장, 5:1–5', s:['eve']},
  {id:'eve', name:'하와', g:'창조에서 홍수까지', extra:'eden', why:"아담의 아내예요. 아담이 \"모든 산 자의 어머니\"라면서 하와라고 불렀어요. 뱀의 말을 듣고 그 열매를 먼저 먹은 것도 하와였어요.", ref:'창 2:21–3:20'},
  {id:'cain', name:'가인', g:'창조에서 홍수까지', f:'adam', m:'eve', why:"아담과 하와의 첫아들이고, 농사를 지었어요. 동생 아벨을 죽인 뒤 떠돌다가 에덴 동쪽 놋 땅에 자리 잡았어요.", ref:'창 4:1–17'},
  {id:'abel', name:'아벨', g:'창조에서 홍수까지', f:'adam', m:'eve', why:"아담과 하와의 둘째 아들이에요. 양을 쳤고, 하나님이 그의 제물을 받으셨어요. 그런데 그 뒤에 형 가인에게 죽임을 당했어요.", ref:'창 4:2–8'},
  {id:'seth', name:'셋', g:'창조에서 홍수까지', f:'adam', m:'eve', era:'912세', why:"아벨이 죽은 뒤에 태어난 셋째 아들이에요. 하나님이 아벨 대신 주셨다며 하와가 셋이라고 이름 지었어요. 노아와 아브라함으로 이어지는 줄기는 셋에게서 나와요.", ref:'창 4:25, 5:3–8'},
  {id:'enosh', name:'에노스', g:'창조에서 홍수까지', f:'seth', era:'905세', why:"셋의 아들이에요. 이때쯤 사람들이 비로소 여호와의 이름을 부르기 시작했대요 (창 4:26).", ref:'창 4:26, 5:6–11'},
  {id:'kenan', name:'게난', g:'창조에서 홍수까지', f:'enosh', era:'910세', why:"에노스의 아들이에요. 창세기 5장에 아담부터 노아까지 열 세대를 잇는 족보가 있는데, 게난은 그 넷째 사람이에요. 910년을 살았대요.", ref:'창 5:9–14'},
  {id:'mahalalel', name:'마할랄렐', g:'창조에서 홍수까지', f:'kenan', era:'895세', why:"게난의 아들이고, 므두셀라에게는 증조할아버지가 돼요. 창세기 5장 족보의 다섯째 사람으로, 895년을 살았어요.", ref:'창 5:12–17'},
  {id:'jared', name:'야렛', g:'창조에서 홍수까지', f:'mahalalel', era:'962세', why:"에녹의 아버지예요. 962년을 살았는데, 므두셀라 다음으로 오래 산 사람이에요.", ref:'창 5:15–20'},
  {id:'enoch', name:'에녹', g:'창조에서 홍수까지', f:'jared', era:'365년', why:"야렛의 아들이고 므두셀라의 아버지예요. 하나님과 동행하다가 죽지 않고 하나님께 들려 갔어요.", ref:'창 5:21–24'},
  {id:'methuselah', name:'므두셀라', g:'창조에서 홍수까지', f:'enoch', era:'969세', why:"에녹의 아들이고 노아의 할아버지예요. 969년을 살았으니, 성경에서 가장 오래 산 사람이죠.", ref:'창 5:25–27'},
  {id:'lamech', name:'라멕', g:'창조에서 홍수까지', f:'methuselah', era:'777세', why:"노아의 아버지예요. 노아를 낳고는 \"이 아들이 우리를 안위하리라\"라고 했어요. 가인 집안에 나오는 라멕과는 다른 사람이에요.", ref:'창 5:28–31'},
  {id:'noah', name:'노아', g:'창조에서 홍수까지', f:'lamech', era:'950세', at:'아라랏산', layer:'w1', why:"라멕의 아들이에요. 악한 세상에서 의인으로 인정받아, 방주를 짓고 홍수를 건넜어요. 셈, 함, 야벳 세 아들에게서 온 민족이 퍼져 나와요.", ref:'창 6–9장'},
  {id:'shem', name:'셈', g:'홍수에서 아브라함까지', f:'noah', era:'600세', why:"노아의 세 아들 중 하나예요. 아브라함으로 이어지는 줄기가 셈에게서 나오고, '셈족'이라는 말도 그의 이름에서 왔어요.", ref:'창 9:26, 11:10–11'},
  {id:'ham', name:'함', g:'홍수에서 아브라함까지', f:'noah', why:"노아의 아들이에요. 그 아들들 가운데 구스, 미스라임(이집트), 가나안이 각자 자기 이름을 딴 민족의 조상이 돼요.", ref:'창 9:22–25, 10:6'},
  {id:'japheth', name:'야벳', g:'홍수에서 아브라함까지', f:'noah', why:"노아의 아들이에요. 바닷가 땅(창 10:5)과 북쪽으로 퍼져 나간 민족들이 야벳에게서 나왔어요.", ref:'창 10:2–5'},
  {id:'canaan', name:'가나안', g:'홍수에서 아브라함까지', f:'ham', why:"함의 아들이에요. 노아에게 저주를 받았는데, 나중에 아브라함이 약속받는 '가나안 땅'이라는 이름이 그에게서 나왔어요.", ref:'창 9:25, 10:15–19'},
  {id:'arpachshad', name:'아르박삿', g:'홍수에서 아브라함까지', f:'shem', era:'438세', why:"셈의 아들이에요. 홍수가 끝나고 2년 뒤에 태어났고, 셈에서 아브라함까지 내려가는 줄기가 그를 거쳐 이어져요.", ref:'창 11:10–13'},
  {id:'shelah', name:'셀라', g:'홍수에서 아브라함까지', f:'arpachshad', era:'433세', why:"아르박삿의 아들이고, 에벨의 아버지예요. 셈부터 아브라함까지 이어지는 창세기 11장 족보에 이름이 나와요.", ref:'창 11:12–15'},
  {id:'eber', name:'에벨', g:'홍수에서 아브라함까지', f:'shelah', era:'464세', why:"셀라의 아들이에요. '히브리'라는 말이 에벨에게서 왔다고들 많이 봐요.", ref:'창 11:14–17, 10:21'},
  {id:'peleg', name:'벨렉', g:'홍수에서 아브라함까지', f:'eber', era:'239세', why:"에벨의 아들이에요. 그가 살던 때에 세상이 나뉘어서 이름을 벨렉이라고 지었대요 (창 10:25). 보통 바벨탑 무렵으로 봐요.", ref:'창 10:25, 11:16–19'},
  {id:'reu', name:'르우', g:'홍수에서 아브라함까지', f:'peleg', era:'239세', why:"벨렉의 아들이고 스룩의 아버지예요. 아브라함에게는 고조할아버지라서 족보에 나와요.", ref:'창 11:18–21'},
  {id:'serug', name:'스룩', g:'홍수에서 아브라함까지', f:'reu', era:'230세', why:"르우의 아들이고 나홀의 아버지예요. 아브라함의 증조할아버지라서 이 족보에 이름이 올라 있죠.", ref:'창 11:20–23'},
  {id:'nahor1', name:'나홀 (데라의 아버지)', g:'홍수에서 아브라함까지', f:'serug', era:'148세', why:"스룩의 아들이고 데라의 아버지예요. 아브라함의 할아버지인데, 손자 나홀(아브라함의 형제)과 이름이 같아요.", ref:'창 11:22–25'},
  {id:'terah', name:'데라', g:'홍수에서 아브라함까지', f:'nahor1', era:'205세', at:'하란', layer:'w1', why:"아브라함의 아버지예요. 가나안으로 가려고 가족을 데리고 우르를 떠났는데, 하란에 머물다가 거기서 죽었어요. 다른 신들을 섬겼다고 해요 (수 24:2).", ref:'창 11:24–32'},
  {id:'nahor2', name:'나홀 (아브라함의 형제)', g:'아브라함 집안', f:'terah', s:['milcah'], at:'하란', layer:'w1', why:"아브라함의 형제예요. 조카 밀가와 결혼해서 하란 쪽 '나홀의 성'에 살았어요. 나중에 손녀 리브가가 이삭의 아내가 되죠.", ref:'창 11:27–29, 22:20–23, 24:10'},
  {id:'haran', name:'하란 (사람)', g:'아브라함 집안', f:'terah', at:'우르', layer:'w1', why:"아브라함의 형제이고, 롯과 밀가의 아버지예요. 아버지 데라보다 먼저 고향 우르에서 죽었어요. 아들 롯은 할아버지 데라와 함께 길을 떠나요.", ref:'창 11:27–28'},
  {id:'milcah', name:'밀가', g:'아브라함 집안', f:'haran', why:"하란의 딸인데, 삼촌 나홀과 결혼했어요. 브두엘을 낳았으니 리브가에게는 할머니가 돼요.", ref:'창 11:29, 22:20–23'},
  {id:'bethuel', name:'브두엘', g:'아브라함 집안', f:'nahor2', m:'milcah', at:'하란', layer:'w1', why:"나홀과 밀가의 아들이에요. 리브가와 라반의 아버지라서, 이삭의 결혼도 야곱의 결혼도 이 집안과 이어져요.", ref:'창 22:22–23, 24:15'},
  {id:'sarah', name:'사라', g:'아브라함 집안', s:['abraham'], era:'127세', at:'헤브론', layer:'w1', why:"아브라함의 아내예요. 오랫동안 아이가 없다가 90세에 약속의 아들 이삭을 낳았어요. 아브라함과는 배다른 누이 사이이기도 해요 (창 20:12).", ref:'창 17:15–19, 21:1–7, 23:1'},
  {id:'hagar', name:'하갈', g:'아브라함 집안', at:'브엘세바', layer:'w1', why:"사라의 이집트인 여종이에요. 아브라함에게서 이스마엘을 낳았어요. 한 번은 도망쳐서, 한 번은 쫓겨나서 광야로 갔는데, 두 번 다 하나님의 사자가 찾아왔어요.", ref:'창 16장, 21:9–21'},
  {id:'ishmael', name:'이스마엘', g:'아브라함 집안', f:'abraham', m:'hagar', era:'137세', why:"아브라함과 하갈 사이에서 난 아들로, 아브라함의 첫아들이에요. 열두 족장의 아버지가 됐고, 전통적으로 아랍 민족들의 조상으로 봐요.", ref:'창 16:15, 17:20, 25:12–18'},
  {id:'keturah', name:'그두라', g:'아브라함 집안', s:['abraham'], why:"창세기에서는 사라가 죽은 다음에 등장하는 아브라함의 아내예요. 아들을 여섯 낳았고, 그중 하나가 미디안이에요.", ref:'창 25:1–6'},
  {id:'midian', name:'미디안', g:'아브라함 집안', f:'abraham', m:'keturah', at:'미디안', layer:'w1', why:"아브라함과 그두라의 아들로, 미디안 족속의 조상이에요. 요셉을 이집트에 판 상인들도, 모세의 장인 이드로도 이 족속 사람이에요.", ref:'창 25:2, 37:28, 36, 출 2:15–16'},
  {id:'moab', name:'모압', g:'아브라함 집안', f:'lot', at:'모압 산지', layer:'w1', why:"롯의 큰딸이 아버지 롯에게서 낳은 아들이에요. 모압 족속의 조상인데, 다윗의 증조할머니 룻도 모압 여인이었어요.", ref:'창 19:37'},
  {id:'ammon', name:'벤암미 (암몬)', g:'아브라함 집안', f:'lot', at:'모압 산지', layer:'w1', why:"롯의 작은딸이 낳은 아들이고, 이름은 벤암미예요. 암몬 족속의 조상이에요. 암몬은 모압과 나란히 이스라엘의 이웃 민족이 되죠.", ref:'창 19:38'},
  {id:'rebekah', name:'리브가', g:'아브라함 집안', f:'bethuel', s:['isaac'], why:"브두엘의 딸이에요. 나홀의 성 우물가에서 아브라함의 종을 만나 이삭의 아내가 됐어요. 야곱을 더 아껴서, 에서 대신 야곱이 축복을 받도록 일을 꾸몄어요.", ref:'창 24장, 27장'},
  {id:'laban', name:'라반', g:'아브라함 집안', f:'bethuel', at:'하란', layer:'w1', why:"리브가의 오빠이고 레아와 라헬의 아버지예요. 형을 피해 온 조카 야곱을 20년 동안 부리면서 품삯을 열 번이나 바꿨어요.", ref:'창 29–31장'},
  {id:'leah', name:'레아', g:'아브라함 집안', f:'laban', s:['jacob'], why:"라반의 큰딸이에요. 아버지가 속임수를 써서 라헬보다 먼저 야곱의 아내가 됐어요. 유다와 레위를 비롯해 아들 여섯과 딸 디나를 낳았어요.", ref:'창 29:16–35, 30:17–21, 49:31'},
  {id:'rachel', name:'라헬', g:'아브라함 집안', f:'laban', s:['jacob'], at:'베들레헴', layer:'w1', why:"라반의 작은딸로, 야곱이 사랑한 아내예요. 오래 아이가 없다가 요셉을 낳았고, 베들레헴으로 가는 길에 베냐민을 낳다가 죽었어요.", ref:'창 29:17–30, 30:22–24, 35:16–20'},
  {id:'bilhah', name:'빌하', g:'아브라함 집안', s:['jacob'], why:"라헬의 여종이에요. 아이가 없던 라헬이 야곱에게 줘서 단과 납달리를 낳았어요. 이 둘은 나중에 이스라엘 열두 지파에 들어가요.", ref:'창 30:3–8'},
  {id:'zilpah', name:'실바', g:'아브라함 집안', s:['jacob'], why:"레아의 여종이에요. 레아가 야곱에게 줘서 갓과 아셀을 낳았는데, 이 둘도 이스라엘 열두 지파에 들어가죠.", ref:'창 30:9–13'},
  {id:'reuben', name:'르우벤', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"야곱의 맏아들이에요. 형제들이 요셉을 죽이려 할 때 살려 보려고 했던 사람이죠. 그런데 아버지의 첩 빌하와 동침한 일 때문에 장자 자리를 잃게 돼요.", ref:'창 29:32, 37:21–22, 49:3–4'},
  {id:'simeon', name:'시므온', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"레위와 함께 세겜 성의 남자들을 죽였어요. 나중에 요셉이 이집트에서 형들을 시험할 때, 인질로 붙잡혀 있던 게 시므온이에요.", ref:'창 34:25, 42:24'},
  {id:'levi', name:'레위', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"시므온과 함께 세겜 사건을 일으켰어요. 그 후손이 제사장 지파인 레위 지파가 돼요. 모세와 아론에게는 증조할아버지고요.", ref:'창 34:25, 출 6:16–20'},
  {id:'judah', name:'유다', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"요셉을 노예로 팔자고 한 게 유다였어요. 그런데 나중에는 베냐민 대신 자기가 종으로 남겠다고 나서요. 다윗도, 예수도 이 사람의 후손이에요.", ref:'창 37:26, 44:33, 49:8–12, 룻 4:18–22'},
  {id:'dan', name:'단', g:'야곱의 열두 아들', f:'jacob', m:'bilhah', why:"라헬의 여종 빌하가 낳은 아들이에요. 단 지파의 조상이고, 사사 삼손이 이 지파에서 나와요.", ref:'창 30:6, 49:16–17'},
  {id:'naphtali', name:'납달리', g:'야곱의 열두 아들', f:'jacob', m:'bilhah', why:"빌하가 낳은 둘째 아들이에요. 후손인 납달리 지파는 나중에 갈릴리 북쪽 땅을 받아요.", ref:'창 30:8, 49:21'},
  {id:'gad', name:'갓', g:'야곱의 열두 아들', f:'jacob', m:'zilpah', why:"레아의 여종 실바가 낳은 아들이에요. 갓 지파가 받은 땅은 요단강 동쪽이에요.", ref:'창 30:11, 민 32'},
  {id:'asher', name:'아셀', g:'야곱의 열두 아들', f:'jacob', m:'zilpah', why:"실바가 낳은 둘째 아들이에요. 아셀 지파는 북쪽 바닷가 쪽 땅을 받았죠.", ref:'창 30:13, 49:20'},
  {id:'issachar', name:'잇사갈', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"레아가 낳은 아들이에요. 잇사갈 지파가 받은 땅은 넓고 기름진 이스르엘 골짜기 쪽이었어요.", ref:'창 30:18, 49:14–15'},
  {id:'zebulun', name:'스불론', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"레아가 낳은 여섯째 아들이에요. 스불론 지파는 갈릴리 지역에 땅을 받아요.", ref:'창 30:20, 49:13'},
  {id:'dinah', name:'디나', g:'야곱의 열두 아들', f:'jacob', m:'leah', why:"야곱의 딸이에요. 그 땅의 추장 세겜(하몰의 아들)에게 욕을 당하는데, 이 일 때문에 오빠 시므온과 레위가 세겜 성을 쳐요.", ref:'창 30:21, 34장'},
  {id:'benjamin', name:'베냐민', g:'야곱의 열두 아들', f:'jacob', m:'rachel', why:"야곱의 막내아들이에요. 어머니 라헬은 베냐민을 낳다가 세상을 떠났어요. 훗날 사울 왕도, 바울도 이 베냐민 지파 사람이에요.", ref:'창 35:18, 43–45장, 삼상 9:1, 빌 3:5'},
  {id:'asenath', name:'아스낫', g:'야곱의 열두 아들', s:['joseph'], at:'온', layer:'w1', why:"이집트 온의 제사장 보디베라의 딸이에요. 바로가 요셉에게 아내로 줬고, 둘 사이에서 므낫세와 에브라임이 태어나요.", ref:'창 41:45'},
  {id:'manasseh', name:'므낫세', g:'야곱의 열두 아들', f:'joseph', m:'asenath', why:"요셉의 맏아들이에요. 므낫세 지파는 땅을 반씩 나눠 받는데, 절반은 요단강 동쪽이고 나머지 절반은 서쪽이에요.", ref:'창 41:51, 48장'},
  {id:'ephraim', name:'에브라임', g:'야곱의 열두 아들', f:'joseph', m:'asenath', why:"요셉의 둘째 아들이에요. 그런데 야곱은 형보다 이 동생을 앞세워서 오른손으로 축복했어요. 여호수아가 이 지파 사람이고, 나중엔 북이스라엘의 중심이 돼요.", ref:'창 41:52, 48:13–20'},
  {id:'kohath', name:'고핫', g:'출애굽 세대', f:'levi', why:"레위의 아들이고, 모세의 할아버지예요. 자손들은 나중에 성막의 거룩한 기구들을 나르는 일을 맡게 돼요.", ref:'출 6:16–18'},
  {id:'amram', name:'아므람', g:'출애굽 세대', f:'kohath', s:['jochebed'], why:"모세와 아론, 미리암의 아버지예요. 레위 지파 고핫 집안 사람이고요.", ref:'출 6:18–20, 민 26:59'},
  {id:'jochebed', name:'요게벳', g:'출애굽 세대', f:'levi', at:'고센', layer:'w2', why:"모세의 어머니예요. 아기 모세를 숨기다가 더는 숨길 수 없게 되자, 갈대 상자에 담아 나일강 갈대 사이에 두었어요.", ref:'출 2:1–10, 6:20, 민 26:59'},
  {id:'miriam', name:'미리암', g:'출애굽 세대', f:'amram', m:'jochebed', at:'가데스바네아', layer:'w2', why:"모세의 누나예요. 갈대 상자에 담긴 동생을 지켜봤고, 홍해를 건넌 뒤에는 소고를 들고 노래했어요. 가데스에서 세상을 떠나요.", ref:'출 2:4–8, 15:20–21, 민 12장, 20:1'},
  {id:'aaron', name:'아론', g:'출애굽 세대', f:'amram', m:'jochebed', s:['elisheba'], era:'123세', at:'호르산', layer:'w2', why:"모세의 형이에요. 말이 서툰 모세 대신 말을 해 줬죠. 첫 대제사장이 됐지만 금송아지를 만든 것도 아론이었어요. 호르산에서 죽어요.", ref:'출 4:14, 28:1, 32장, 민 20:22–29, 33:39'},
  {id:'elisheba', name:'엘리세바', g:'출애굽 세대', why:"아론의 아내예요. 유다 지파 암미나답의 딸이고, 제사장이 되는 네 아들 나답, 아비후, 엘르아살, 이다말을 낳아요.", ref:'출 6:23'},
  {id:'nadab', name:'나답', g:'출애굽 세대', f:'aaron', m:'elisheba', why:"아론의 맏아들이에요. 하나님이 명하지 않은 다른 불을 드렸다가 불에 타 죽어요.", ref:'레 10:1–2'},
  {id:'abihu', name:'아비후', g:'출애굽 세대', f:'aaron', m:'elisheba', why:"아론의 둘째 아들이에요. 형 나답과 함께 다른 불을 드렸다가 같이 죽었어요.", ref:'레 10:1–2'},
  {id:'eleazar', name:'엘르아살', g:'출애굽 세대', f:'aaron', m:'elisheba', why:"아론의 셋째 아들이에요. 아론이 죽은 뒤 대제사장이 되고, 여호수아와 함께 가나안 땅을 지파별로 나눠 줘요.", ref:'민 20:25–28, 수 14:1'},
  {id:'ithamar', name:'이다말', g:'출애굽 세대', f:'aaron', m:'elisheba', why:"아론의 넷째 아들이에요. 형 엘르아살과 함께 제사장 일을 이어 갔고, 제사장 가문의 한 줄기가 됐어요.", ref:'출 6:23, 민 4:28'},
  {id:'phinehas', name:'비느하스', g:'출애굽 세대', f:'eleazar', why:"엘르아살의 아들이에요. 싯딤에서 백성이 바알브올을 섬길 때, 창을 들고 나서서 재앙을 멈추게 해요.", ref:'민 25:7–13'},
  {id:'jethro', name:'이드로 (르우엘)', g:'출애굽 세대', at:'미디안', layer:'w2', why:"미디안의 제사장이자 모세의 장인이에요. 모든 재판을 혼자 떠안고 있던 모세를 보고, 일을 나눠 맡기라고 조언해 줘요.", ref:'출 2:16–21, 18장'},
  {id:'zipporah', name:'십보라', g:'출애굽 세대', f:'jethro', s:['moses'], why:"미디안 제사장 이드로의 딸로, 모세의 아내예요. 이집트에서 도망친 모세가 미디안에 머물던 때 결혼했어요.", ref:'출 2:21, 4:24–26'},
  {id:'gershom', name:'게르솜', g:'출애굽 세대', f:'moses', m:'zipporah', why:"모세의 맏아들이에요. \"내가 타국에서 나그네가 되었다\"면서 모세가 지은 이름이라, \"나그네\"라는 뜻이 담겨 있어요.", ref:'출 2:22, 18:3'},
  {id:'eliezer', name:'엘리에셀 (모세의 아들)', g:'출애굽 세대', f:'moses', m:'zipporah', why:"모세의 둘째 아들이에요. 이름에 \"하나님이 나를 도우셨다\"는 뜻이 있어요.", ref:'출 18:4'},
  {id:'nun', name:'눈', g:'출애굽 세대', why:"여호수아의 아버지고, 에브라임 지파 사람이에요.", ref:'민 13:8, 대상 7:20–27'},
  {id:'jephunneh', name:'여분네', g:'출애굽 세대', why:"갈렙의 아버지예요. 그나스 사람인데 유다 지파에 속해 있었죠.", ref:'민 13:6, 수 14:6'},

// ===== 데이터 =====
const LX=typeof LIFE!=='undefined'?LIFE:{};
const P=PEOPLE.filter(p=>p.id!=='israel').map(p=>Object.assign({},p,LX[p.id]||{}));
const byId={};P.forEach(p=>byId[p.id]=p);
const nm=p=>p.name.replace(/\s*\(.*\)\s*$/,'');
const born=p=>p&&p.b!=null?p.b:0;
const by=(a,b)=>born(a)-born(b);
// 결혼 쌍과 "들어온 사람" (자녀의 아버지 쪽 집안에 자리를 둠)
const pairs=[],pseen=new Set();
P.forEach(p=>(p.s||[]).forEach(sid=>{const q=byId[sid];if(!q)return;const key=[p.id,sid].sort().join('|');if(pseen.has(key))return;pseen.add(key);pairs.push([p,q]);}));
const spousesOf=id=>pairs.filter(([a,b])=>a.id===id||b.id===id).map(([a,b])=>a.id===id?b:a);
const ownerOf={};
pairs.forEach(([a,b])=>{const ka=P.some(c=>c.f===a.id),kb=P.some(c=>c.f===b.id);let o;
  if(ka&&!kb)o=a;else if(kb&&!ka)o=b;else{const ha=!!(a.f||a.anc),hb=!!(b.f||b.anc);o=ha&&!hb?a:hb&&!ha?b:(a.main?a:b);}
  const m=o===a?b:a;if(!ownerOf[m.id])ownerOf[m.id]=o.id;});

const slotKids=id=>P.filter(q=>q.f===id||(!q.f&&q.m===id)||(!q.f&&!q.m&&q.anc===id)).sort(by); // 태어난 자리 기준 자녀
const allKids=id=>P.filter(q=>q.f===id||q.m===id).sort(by);
const MILE=new Set(['adam','noah','abraham','jacob']);

// ===== 무엇을 보여줄지 (중심 인물 기준) =====
let FOCUS=null;const EXPK=new Set(),EXPC=new Set();
function compute(F){
  const vis=new Set(),ali=new Set(),keep=new Set([F,...EXPC]);MILE.forEach(m=>keep.add(m));
  const f=byId[F];
  const addBirth=id=>{if(ownerOf[id])ali.add(id);else vis.add(id);};
  const addKidsOf=id=>{allKids(id).forEach(c=>{addBirth(c.id);spousesOf(c.id).filter(s=>ownerOf[s.id]===c.id).forEach(s=>vis.add(s.id));});};
  const up=(p,depth)=>{const bp=bpOf(p);
    if(bp){const q=byId[bp.id];vis.add(q.id);if(ownerOf[q.id])vis.add(ownerOf[q.id]);if(depth<2)keep.add(q.id);up(q,depth+1);}
    if(p.m&&byId[p.m]&&bp&&bp.t==='f'){const m=byId[p.m];vis.add(m.id);if(depth<2){keep.add(m.id);if(ownerOf[m.id]&&bpOf(m)){ali.add(m.id);up(m,depth+1);}}}};
  if(ownerOf[F]){const o=byId[ownerOf[F]];vis.add(F);vis.add(o.id);keep.add(o.id);if(bpOf(f)){ali.add(F);up(f,0);const bp=bpOf(f);slotKids(bp.id).forEach(s=>addBirth(s.id));}up(o,0);}
  else{vis.add(F);up(f,0);const bp=bpOf(f);if(bp)slotKids(bp.id).forEach(s=>addBirth(s.id));
    spousesOf(F).filter(s=>ownerOf[s.id]===F).forEach(s=>vis.add(s.id));}
  addKidsOf(F);
  EXPK.forEach(id=>{if(vis.has(id)||ali.has(id))slotKids(id).forEach(c=>{addBirth(c.id);spousesOf(c.id).filter(s=>ownerOf[s.id]===c.id).forEach(s=>vis.add(s.id));});});
  // 단위(사람 + 들어온 배우자)
  const U={};const mk=(key,o)=>U[key]=Object.assign({key,kids:[]},o);
  vis.forEach(id=>{if(ownerOf[id])return;mk('p:'+id,{id,sp:spousesOf(id).filter(s=>ownerOf[s.id]===id&&vis.has(s.id)).sort((a,b)=>(a.mar??born(a))-(b.mar??born(b))).map(s=>s.id)});});
  ali.forEach(id=>mk('a:'+id,{id,alias:true,sp:[]}));
  const roots=[];
  Object.values(U).filter(u=>!u.chain).forEach(u=>{const bp=bpOf(byId[u.id]);const pu=bp&&U['p:'+bp.id];
    if(pu){if(bp.t==='anc'){const c=mk('c:anc:'+u.id,{chain:true,fixed:true,label:'⋯ 여러 대',ids:[]});c.kids.push(u);u.parent=c;c.parent=pu;pu.kids.push(c);}else{pu.kids.push(u);u.parent=pu;}}
    else roots.push(u);});
  const kidId=u=>u.chain?(u.kids[0]&&u.kids[0].id):u.id;
  Object.values(U).forEach(u=>u.kids.sort((a,b)=>by(byId[kidId(a)],byId[kidId(b)])));
  // 가려진 자녀 수
  Object.values(U).forEach(u=>{if(u.chain||u.alias){u.hid=0;return;}const shown=new Set(u.kids.map(kidId));u.tot=slotKids(u.id).length;u.hid=slotKids(u.id).filter(c=>!shown.has(c.id)).length;});
  // 외줄기 세대 접기
  const comp=u=>!u.chain&&!u.alias&&u.parent&&!keep.has(u.id)&&u.sp.length===0&&u.kids.length===1&&!u.kids[0].chain&&!EXPK.has(u.id);
  const fold=u=>{u.kids=u.kids.map(c=>{if(!comp(c))return c;const run=[];let x=c;while(x&&comp(x)){run.push(x);x=x.kids[0];}
      if(run.length<2)return c;const ch={key:'c:'+run[0].id+'-'+run[run.length-1].id,chain:true,ids:run.map(r=>r.id),label:`⋯ ${run.length}대`,kids:[x],parent:u};x.parent=ch;return ch;});
    u.kids.forEach(fold);};
  roots.forEach(fold);
  return roots.sort((a,b)=>by(byId[a.id],byId[b.id]));
}

// ===== 배치 =====
const NW=104,NH=40,CG=26,SG=16,VG=64,VGC=40,CHW=96,CHH=28,GG=8,GCOLS=4;
function prep(u,F){if(u.grid)return;
  u.kids.forEach(c=>prep(c,F));
  if(u.chain)return;
  const isLeaf=c=>!c.chain&&!c.grid&&c.kids.length===0&&c.sp.length===0&&c.id!==F&&!(c.hid>0);
  const leaves=u.kids.filter(isLeaf);
  if(leaves.length>=6){const i0=u.kids.findIndex(isLeaf);const others=u.kids.filter(c=>!isLeaf(c));
    const blk={key:'g:'+u.key,grid:true,items:leaves,cols:Math.min(GCOLS,leaves.length),parent:u};
    others.splice(Math.min(i0,others.length),0,blk);u.kids=others;}}
function measure(u){if(u.grid){u.rows=Math.ceil(u.items.length/u.cols);u.w=u.cols*NW+(u.cols-1)*GG;u.h=u.rows*NH+(u.rows-1)*GG;return;}

    u.items.forEach((it,i)=>{it.x=x+(i%u.cols)*(NW+GG);it.y=y+Math.floor(i/u.cols)*(NH+GG);out[(it.alias?'a:':'p:')+it.id]={t:it.alias?'a':'p',id:it.id,x:it.x,y:it.y,hid:0};});return;}
  u.x=x+(u.w-u.uw)/2;
  if(u.chain)out[u.key]={t:'c',x:u.x,y,label:u.label,ids:u.ids,fixed:!!u.fixed};
  else{out[(u.alias?'a:':'p:')+u.id]={t:u.alias?'a':'p',id:u.id,x:u.x,y,hid:u.hid};
    u.sp.forEach((s,i)=>{out['p:'+s]={t:'p',id:s,x:u.x+(i+1)*(NW+CG),y,hid:0};});}
  const h=u.chain?CHH:NH;let cx=x+(u.w-u.kw)/2;
  u.kids.forEach(c=>{const gap=(u.chain||c.chain)?VGC:VG;place(c,cx,y+h+gap+(c.grid?GG:0),out);cx+=c.w+SG;});}
function layout(F){const roots=compute(F);roots.forEach(r=>prep(r,F));roots.forEach(measure);
  const out={};let x=0;roots.forEach(r=>{place(r,x,0,out);x+=r.w+SG*4;});
  const links=[];
  const walk=u=>{if(u.grid)return;
    if(!u.chain&&u.sp.length){let prev='p:'+u.id;u.sp.forEach(s=>{links.push({t:'m',a:prev,b:'p:'+s,o:'p:'+u.id});prev='p:'+s;});}
    if(u.kids.length){const from=u.chain?{k:u.key,ch:true}:(u.sp.length===1?{k:'p:'+u.id,b:'p:'+u.sp[0]}:{k:(u.alias?'a:':'p:')+u.id});
      links.push({t:'f',from,kids:u.kids.map(c=>c.grid?{k:c.key,g:true}:c.chain?{k:c.key,ch:true}:{k:(c.alias?'a:':'p:')+c.id}),dash:!!(u.chain||u.kids.some(c=>c.chain&&c.fixed))});}
    u.kids.forEach(walk);};
  roots.forEach(walk);
  return{pos:out,links};}

// ===== 그리기 (위치는 애니메이션으로 옮김) =====
let CUR={},LINKS=[],anim=null;
const mainIds=new Set(P.filter(p=>p.main).map(p=>p.id));
function boxOf(e){if(e.t==='c')return{x:e.x,y:e.y,w:CHW,h:CHH};if(e.t==='g')return{x:e.x,y:e.y,w:e.w,h:e.h};return{x:e.x,y:e.y,w:NW,h:NH};}
function draw(S){let back='',w='',n='';
  LINKS.forEach(L=>{
    if(L.t==='m'){const a=S[L.a],b=S[L.b];if(!a||!b)return;const y=a.y+NH/2;const o=Math.min(a.o??1,b.o??1);w+=`<line class="mar" x1="${a.x+NW}" y1="${y}" x2="${b.x}" y2="${y}" opacity="${o}"/>`;
      if(L.a===L.o)w+=`<circle class="ring" cx="${(a.x+NW+b.x)/2}" cy="${y}" r="4.5" opacity="${o}"/>`;return;}
    const fa=S[L.from.k];if(!fa)return;let sx,sy;
    if(L.from.b&&S[L.from.b]){const b=S[L.from.b];sx=(fa.x+NW+b.x)/2;sy=fa.y+NH/2;}else{const bx=boxOf(fa);sx=bx.x+bx.w/2;sy=bx.y+bx.h;}
    const tops=L.kids.map(c=>{const e=S[c.k];if(!e)return null;const bx=boxOf(e);return{x:bx.x+bx.w/2,y:bx.y,o:e.o??1};}).filter(Boolean);if(!tops.length)return;
    const busY=Math.min(...tops.map(t=>t.y))-(L.from.ch||L.kids.some(c=>c.ch)?VGC/2:VG/2);

    let d=`M${sx},${sy} V${busY} M${x0},${busY} H${x1}`;tops.forEach(t=>{d+=` M${t.x},${busY} V${t.y}`;});

    if(e.t==='p'&&(e.hid>0||EXPK.has(e.id))){const open=EXPK.has(e.id)&&!(e.hid>0);n+=`<g class="bd${open?' open':''}" data-exp="${e.id}" transform="translate(${e.x+NW-6} ${e.y+NH-2})" opacity="${o}"><circle r="11"/><text y="4" text-anchor="middle">${open?'−':'+'+e.hid}</text></g>`;}});

function relayout(opts={}){const{pos,links}=layout(FOCUS);LINKS=links;
  const from=CUR,to=pos;const keys=new Set([...Object.keys(from),...Object.keys(to)]);
  const start={},end={};
  keys.forEach(k=>{const a=from[k],b=to[k];
    if(a&&b){start[k]=Object.assign({},b,{x:a.x,y:a.y,w:a.w??b.w,h:a.h??b.h,o:a.o??1});end[k]=Object.assign({},b,{o:1});}
    else if(b){start[k]=Object.assign({},b,{o:0});end[k]=Object.assign({},b,{o:1});}
    else{start[k]=Object.assign({},a);end[k]=Object.assign({},a,{o:0});}});

  if(anim)cancelAnimationFrame(anim);

  const t0=performance.now(),D=460;

    keys.forEach(k=>{const a=start[k],b=end[k];S[k]=Object.assign({},b,{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q,o:a.o+(b.o-a.o)*q});if(a.w!=null&&b.w!=null){S[k].w=a.w+(b.w-a.w)*q;S[k].h=a.h+(b.h-a.h)*q;}});

// ===== 보기(확대·이동) =====
let V={x:-200,y:-100,w:1200},k=1,vanim=null;
const rect=()=>svg.getBoundingClientRect();
function applyV(v){const r=rect();V={x:v.x,y:v.y,w:v.w};k=V.w/Math.max(1,r.width);svg.setAttribute('viewBox',`${V.x} ${V.y} ${V.w} ${V.w*r.height/Math.max(1,r.width)}`);}
function goV(v,instant){if(vanim)cancelAnimationFrame(vanim);if(instant||reduced||document.hidden){applyV(v);return;}
  const f={...V},t0=performance.now(),D=460;const step=t=>{let q=Math.min(1,(t-t0)/D);q=q<.5?2*q*q:-1+(4-2*q)*q;applyV({x:f.x+(v.x-f.x)*q,y:f.y+(v.y-f.y)*q,w:f.w+(v.w-f.w)*q});if(q<1)vanim=requestAnimationFrame(step);else vanim=null;};vanim=requestAnimationFrame(step);}
function area(){const r=rect();let b=r.height;if(!EMBED&&narrow()){const s=$('side').getBoundingClientRect();b=Math.max(140,s.top-r.top);}return{W:r.width,H:r.height,t:16,b:b-56,l:16,r:r.width-16};}
const KMAX=()=>EMBED?1.9:narrow()?1.6:1.35,KMIN=.5;
function frameView(pos,instant){const a=area();const es=Object.values(pos);if(!es.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;es.forEach(e=>{const b=boxOf(e);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w+14);y1=Math.max(y1,b.y+b.h+14);});
  const aw=a.r-a.l,ah=a.b-a.t;let kk=Math.max((x1-x0)/aw,(y1-y0)/ah,KMIN);let cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(kk>KMAX()){kk=KMAX();const f=pos['p:'+FOCUS]||pos['a:'+FOCUS];if(f){
      // 너무 크면: 중심 인물을 가운데에, 바로 위 부모 칸까지 보이게
      cx=f.x+NW/2;cy=f.y+NH/2+20;
      cx=Math.min(Math.max(cx,x0+aw*kk/2),x1-aw*kk/2);cy=Math.min(Math.max(cy,y0+ah*kk/2),y1-ah*kk/2);}}
  const sx=(a.l+a.r)/2,sy=(a.t+a.b)/2;goV({x:cx-sx*kk,y:cy-sy*kk,w:a.W*kk},instant);}

    ${p.nat?`<span class="nat">→ ${esc(p.nat)}</span>`:''}
    <p class="ref">${esc(p.ref||'')}${p.src?` · 연도는 ${esc(p.src)}에서`:''}</p>
    ${fam.length?`<p class="lbl">가족</p><dl class="fam">${fam.map(([kk,v])=>`<dt>${kk}</dt><dd>${v.map(chip).join('')}</dd>`).join('')}</dl>`:''}
    ${line.length>1?`<p class="lbl">아담에서 여기까지</p><div class="chain">${line.map(q=>q===p?`<span class="pc cur">${esc(nm(q))}</span>`:chip(q)).join('<span class="s">›</span>')}</div>`:''}
    ${hasMap?`<a class="go" href="map.html#p-${p.id}">지도에서 ${p.steps?'이 사람이 간 길':'사는 곳'} 보기 →</a>`:''}`;
  $('info').scrollTop=0;$('find').value=id;}

// ===== 중심 바꾸기 =====
function focusOn(id,opts={}){if(!byId[id])return;FOCUS=id;relayout(opts);if(!EMBED)showInfo(id);
  try{history.replaceState(null,'',EMBED?`#embed-p-${id}`:`#p-${id}`);}catch(e){}
  if(EMBED){try{parent.postMessage({bibleTree:'sel',id},'*');}catch(e){}}}
function toggleKids(id){if(EXPK.has(id))EXPK.delete(id);else EXPK.add(id);relayout();}
function openChain(ids){ids.forEach(i=>EXPC.add(i));relayout();}

// ===== 입력 =====
const GROUPS=['창조에서 홍수까지','홍수에서 아브라함까지','아브라함 집안','야곱의 열두 아들','출애굽 세대','족장 시대 (추정)'];
$('find').innerHTML='<option value="">사람 찾기…</option>'+GROUPS.map(g=>{const L=P.filter(p=>p.g===g).sort(by);return L.length?`<optgroup label="${esc(g)}">${L.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</optgroup>`:'';}).join('');
$('find').addEventListener('change',e=>{if(e.target.value){focusOn(e.target.value);peek(true);}});
$('quick').innerHTML=['adam','noah','abraham','isaac','jacob','joseph','moses','joshua'].map(id=>chip(byId[id])).join('');
document.addEventListener('click',e=>{const c=e.target.closest('.pc[data-id]');if(c&&!c.classList.contains('cur')){focusOn(c.dataset.id);}});
$('handle').addEventListener('click',()=>peek(!$('side').classList.contains('peek')));
function peek(on){if(!narrow()||EMBED)return;$('side').classList.toggle('peek',on);$('app').classList.toggle('peek',on);$('handle').setAttribute('aria-label',on?'설명 펼치기':'설명 접기');setTimeout(()=>frameView(CUR,false),280);}
$('fit').addEventListener('click',()=>frameView(CUR));
const zoomBy=f=>{const a=area();const cx=V.x+((a.l+a.r)/2)*k,cy=V.y+((a.t+a.b)/2)*k;const nk=Math.min(4,Math.max(.25,k*f));goV({x:cx-((a.l+a.r)/2)*nk,y:cy-((a.t+a.b)/2)*nk,w:a.W*nk});};
$('zin').addEventListener('click',()=>zoomBy(1/1.4));$('zout').addEventListener('click',()=>zoomBy(1.4));
G.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const n=e.target.closest('.nd');if(n){e.preventDefault();focusOn(n.dataset.id);}});
function hitAt(x,y){const el=document.elementFromPoint(x,y);if(!el||!el.closest)return;
  const b=el.closest('.bd');if(b){toggleKids(b.dataset.exp);return;}
  const c=el.closest('.ch');if(c&&!c.classList.contains('fixed')){openChain(c.dataset.chain.split(','));return;}
  const n=el.closest('.nd');if(n){if(n.dataset.id!==FOCUS)focusOn(n.dataset.id);peek(true);}}
const ptrs=new Map();let drag=null,dragged=false,pinch=null;
const toMap=(sx,sy)=>[V.x+sx*k,V.y+sy*k];
svg.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);
  if(ptrs.size===2){const[p,q]=[...ptrs.values()];const r=rect();pinch={d:Math.hypot(p.x-q.x,p.y-q.y),m:toMap((p.x+q.x)/2-r.left,(p.y+q.y)/2-r.top),k0:k};drag=null;dragged=true;return;}
  drag={x:e.clientX,y:e.clientY,v:{...V}};dragged=false;});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const[p,q]=[...ptrs.values()];const r=rect();const nk=Math.min(4,Math.max(.25,pinch.k0*pinch.d/(Math.hypot(p.x-q.x,p.y-q.y)||1)));const mx=(p.x+q.x)/2-r.left,my=(p.y+q.y)/2-r.top;if(vanim){cancelAnimationFrame(vanim);vanim=null;}applyV({x:pinch.m[0]-mx*nk,y:pinch.m[1]-my*nk,w:r.width*nk});return;}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){dragged=true;svg.classList.add('drag');}if(!dragged)return;
  if(vanim){cancelAnimationFrame(vanim);vanim=null;}applyV({x:drag.v.x-dx*k,y:drag.v.y-dy*k,w:drag.v.w});});
const endP=e=>{const was=dragged;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){svg.classList.remove('drag');if(drag&&!was&&e.type==='pointerup')hitAt(e.clientX,e.clientY);drag=null;}
  else if(ptrs.size===1&&!pinch){const[p]=[...ptrs.values()];drag={x:p.x,y:p.y,v:{...V}};}};
svg.addEventListener('pointerup',endP);svg.addEventListener('pointercancel',endP);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=rect();const sx=e.clientX-r.left,sy=e.clientY-r.top;const m=toMap(sx,sy);const nk=Math.min(4,Math.max(.25,k*Math.exp(e.deltaY*0.0015)));if(vanim){cancelAnimationFrame(vanim);vanim=null;}applyV({x:m[0]-sx*nk,y:m[1]-sy*nk,w:r.width*nk});},{passive:false});
addEventListener('resize',()=>applyV(V));
function openHash(instant){let h=(location.hash||'').slice(1);if(h.startsWith('embed-'))h=h.slice(6);if(h.startsWith('p-')&&byId[h.slice(2)]){if(h.slice(2)!==FOCUS)focusOn(h.slice(2),{instant});return true;}return false;}
addEventListener('hashchange',()=>openHash(false));

// 시작
applyV(V);
if(narrow()&&!EMBED)peek(true);
if(!openHash(true))focusOn('abraham',{instant:true});
</script>
</body></html>
