<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>성경 인물 가계도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽 넓은 가계도(이름과 선만), 오른쪽 사이드바(설명). 휴대폰은 사이드바가 아래에서 올라옴 */
:root{
  --ground:#f4f1ea; --paper:#fbfaf6; --surface:#ffffff; --ink:#22211d; --ink-2:#57554d; --muted:#8c897e;
  --line:#e2ded3; --band:#efebe1; --hover:#f1efe7;
  --node:#ffffff; --node-line:#cfc9bb; --wire:#8f8a7c; --focus:#22211d; --focus-ink:#fbfaf6;
  --gold:#b57a00; --accent:#2f6fb5;
  --display:"Gowun Batang",serif; --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --navh:44px; --sidew:340px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151513; --paper:#1a1a18; --surface:#1f1f1c; --ink:#f0eee7; --ink-2:#bdbab0; --muted:#8a877d;
    --line:#2f2e2a; --band:#22211e; --hover:#272622;
    --node:#23221f; --node-line:#45433d; --wire:#76726a; --focus:#f0eee7; --focus-ink:#151513;
    --gold:#dba53a; --accent:#5b9be0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#151513; --paper:#1a1a18; --surface:#1f1f1c; --ink:#f0eee7; --ink-2:#bdbab0; --muted:#8a877d;
  --line:#2f2e2a; --band:#22211e; --hover:#272622;
  --node:#23221f; --node-line:#45433d; --wire:#76726a; --focus:#f0eee7; --focus-ink:#151513;
  --gold:#dba53a; --accent:#5b9be0; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{position:relative;height:calc(100% - var(--navh));display:grid;grid-template-columns:minmax(0,1fr) var(--sidew)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
#tree{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#tree.drag{cursor:grabbing}

/* 가계도: 이름과 선만 */
.wire{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.wire.dash{stroke-dasharray:4 5}
.mar{stroke:var(--wire);stroke-width:2.2}
.ring{fill:var(--paper);stroke:var(--wire);stroke-width:1.6}
.nd{cursor:pointer}
.nd rect.box{fill:var(--node);stroke:var(--node-line);stroke-width:1.4}
.nd text{font-family:var(--ui);font-size:14px;font-weight:600;fill:var(--ink);pointer-events:none}
.nd .mb{fill:var(--gold)}
.nd:hover rect.box{stroke:var(--ink-2)}
.nd.fo rect.box{fill:var(--focus);stroke:var(--focus)}
.nd.fo text{fill:var(--focus-ink)}
.nd.al rect.box{fill:transparent;stroke-dasharray:5 4}
.nd.al text{fill:var(--ink-2);font-weight:500}
.nd.al .arr{font-size:11px;fill:var(--muted)}
.bd{cursor:pointer}
.bd circle{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.bd text{font-family:var(--ui);font-size:11px;font-weight:700;fill:#fff;pointer-events:none}
.bd.open circle{fill:var(--muted)}
.ch{cursor:pointer}
.ch rect{fill:var(--band);stroke:var(--node-line);stroke-width:1.2;stroke-dasharray:3 3}
.ch text{font-family:var(--ui);font-size:12px;font-weight:600;fill:var(--ink-2);pointer-events:none}
.ch.fixed{cursor:default}
.blk{fill:var(--band);stroke:var(--line);stroke-width:1}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:3}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.tools button:hover{background:var(--hover)}

/* 사이드바 */
.side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.sh{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sh select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.pc{border:1px solid var(--line);background:var(--band);color:var(--ink);border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;cursor:pointer;line-height:1.6}
.pc:hover{background:var(--hover)}
.pc.cur{background:var(--ink);color:var(--surface);border-color:var(--ink);cursor:default}
.pc.main{border-color:var(--gold)}
.handle{display:none}
.info{flex:1 1 auto;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.grp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.grp i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.grp.main i{background:var(--gold)}
.info h2{font-family:var(--display);font-size:24px;margin:4px 0 0;text-wrap:balance}
.yrs{margin:2px 0 0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kb{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);margin-left:4px;vertical-align:1px}
.why{margin:12px 0 0;font-size:14.5px}
.why::before{content:'왜 나오나 · ';color:var(--muted);font-size:12px}
.nt{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.nat{display:inline-block;margin:10px 0 0;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.ref{margin:10px 0 0;font-size:12px;color:var(--muted)}
.lbl{margin:16px 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center;font-size:12px}
.chain .s{color:var(--muted)}
.fam{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;align-items:baseline;margin:0}
.fam dt{color:var(--muted)}
.fam dd{margin:0;display:flex;flex-wrap:wrap;gap:4px}
.go{display:inline-block;margin-top:16px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.go:hover{text-decoration:underline}
.howto{border-top:1px solid var(--line);padding:10px 16px 14px;font-size:12.5px;color:var(--ink-2)}
.howto summary{cursor:pointer;font-weight:600;color:var(--ink)}
.howto ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 지도 속 작은 창 */
.embed .snav,.embed .side{display:none!important}
.embed .app{height:100%;grid-template-columns:minmax(0,1fr)}
.embed .tools{left:8px;bottom:8px}
.embed .tools button{height:32px;min-width:32px;font-size:12px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;left:0;right:0;bottom:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.12);z-index:4;transition:height .25s ease}
  .side.peek{height:150px}
  .handle{display:flex;justify-content:center;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;padding:7px 0 0;cursor:pointer;width:100%}
  .handle::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--line)}
  .sh{order:3;border-bottom:0;border-top:1px solid var(--line)}
  .side.peek .sh,.side.peek .howto{display:none}
  .info{padding:6px 16px 14px}
  .info h2{font-size:21px}
  .howto{order:4}
  .tools{bottom:calc(46% + 10px)}
  .app.peek .tools{bottom:160px}
}
@media (prefers-reduced-motion: reduce){.side{transition:none}}
</style>
<style>
.snav{--navh:44px;height:var(--navh);display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--line,#e3e2dc);background:var(--surface,#fff);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;overflow-x:auto;white-space:nowrap;box-sizing:border-box}
.snav a{color:var(--ink-2,#55544e);text-decoration:none;padding:6px 10px;border-radius:7px;flex:0 0 auto}
.snav a:hover{background:var(--band,#efeee9);color:var(--ink,#1c1c1a)}
.snav a[aria-current="page"]{background:var(--band,#efeee9);color:var(--ink,#1c1c1a);font-weight:600}
.snav .brand{font-family:"Gowun Batang",serif;font-weight:700;font-size:14px;color:var(--ink,#1c1c1a);margin-right:6px}
.snav .brand:hover{background:none}
</style>

      <ul>

        <li><svg width="34" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="var(--wire)" stroke-width="2"/><circle cx="17" cy="10" r="4" fill="var(--paper)" stroke="var(--wire)" stroke-width="1.6"/></svg>결혼</li>
        <li><svg width="34" height="22"><path d="M17 1 V8 M6 8 H28 M6 8 V20 M28 8 V20" fill="none" stroke="var(--wire)" stroke-width="1.6"/></svg>자녀</li>
        <li><svg width="34" height="22"><circle cx="17" cy="11" r="9" fill="var(--accent)"/><text x="17" y="15" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">+3</text></svg>아직 안 보이는 자녀. 누르면 펼쳐져요</li>
        <li><svg width="34" height="20"><rect x="1" y="3" width="32" height="14" rx="7" fill="var(--band)" stroke="var(--node-line)" stroke-dasharray="3 3"/></svg>접어 둔 세대 (⋯ 7대). 누르면 펼쳐져요</li>
        <li><svg width="34" height="20"><rect x="1" y="2" width="32" height="16" rx="5" fill="none" stroke="var(--node-line)" stroke-dasharray="5 4"/></svg>다른 집안으로 시집·장가간 사람이 태어난 자리</li>
        <li><svg width="34" height="20"><rect x="1" y="2" width="32" height="16" rx="5" fill="var(--node)" stroke="var(--node-line)"/><rect x="5" y="2" width="24" height="3" fill="var(--gold)"/></svg>이야기가 따라가는 줄기</li>
      </ul>
    </details>
  </aside>
</div>

<script>
// ===== 지도 데이터 (1·2주) =====

// 위치가 전통적 추정인 곳은 note에 적음.

const PLACES = {
  // --- 메소포타미아·북쪽

  '다메섹':      {p:[36.29,33.51], note:'아브라함의 종 엘리에셀의 고향'},

  '세겜':        {p:[35.28,32.21], note:'아브라함이 가나안에서 첫 제단을 쌓은 곳. 여호수아의 고별 언약'},

  '기브온':      {p:[35.19,31.85], note:'속임수로 이스라엘과 동맹한 성'},

  '브엘세바':    {p:[34.79,31.25], note:'맹세의 우물. 아브라함·이삭·야곱의 남쪽 거점'},

  '엘림':        {p:[32.95,29.25], note:'샘 12개, 종려 70그루 (위치 추정)'},

   note:'20년 만에 돌아오는 길. 라반이 쫓아와 길르앗 산에서 화해하고, 얍복 강가에서 밤새 씨름한 뒤 "이스라엘"이라는 이름을 받아요. 다음 날 에서와 화해. 세겜을 거쳐 벧엘로, 라헬은 베들레헴 가는 길에 베냐민을 낳고 죽어요. 헤브론에서 아버지 이삭을 만나요.',
   places:['하란','브니엘','세겜','벧엘','베들레헴','헤브론','세일'],

   people:[{name:'야곱', at:'브니엘'},{name:'에서', at:'세일'}],
   events:[{at:'브니엘', t:'얍복 강가의 씨름, 이름이 이스라엘로', ref:'창 32장'},{at:'세겜', t:'땅을 사고 제단을 쌓음. 디나 사건', ref:'창 33:18–34장'},{at:'벧엘', t:'다시 벧엘로, 제단', ref:'창 35장'},{at:'베들레헴', t:'라헬의 죽음, 베냐민 출생', ref:'창 35:16–20'},{at:'헤브론', t:'아버지 이삭을 다시 만남. 이삭의 죽음(180세)은 연대상 요셉이 팔린 뒤', ref:'창 35:27–29'}]},

  {week:1, id:'w1-7', title:'요셉, 도단에서 이집트로', ref:'창 37–40', era:'BC 1898경', view:'nearE', layer:'w1',
   note:'열일곱 살 요셉은 채색옷과 꿈 때문에 형들의 미움을 사요. 헤브론에서 형들을 찾아 세겜, 도단까지 갔다가 거기서 팔려요. 미디안·이스마엘 상인들이 (아마 해안 길로) 이집트까지 데려가고, 보디발의 집, 억울한 감옥, 술 맡은 자와 떡 맡은 자의 꿈까지. 13년이 지나가요.',
   places:['헤브론','세겜','도단','가사','고센','멤피스'],
   routes:[{who:'요셉', color:'gosp', pts:['헤브론','세겜','도단']},{who:'상인들', color:'gosp', dashed:true, pts:['도단','가사','고센','멤피스']}],
   people:[{name:'요셉', at:'멤피스'},{name:'야곱', at:'헤브론'}],
   events:[{at:'도단', t:'형들에게 은 20에 팔림', ref:'창 37장'},{at:'멤피스', t:'보디발의 집, 감옥, 두 관원의 꿈 (바로의 궁 부근으로 추정)', ref:'창 39–40장'}]},

  {week:1, id:'w1-8', title:'바로의 꿈, 가족의 이주', ref:'창 41–50', era:'BC 1885–1805', view:'nearE', layer:'w1',
   note:'서른 살에 바로의 꿈을 풀고 총리가 돼요. 7년 풍년, 7년 흉년. 흉년에 형들이 곡식을 사러 두 번 오고, "내가 요셉입니다." 야곱은 브엘세바에서 제사를 드린 뒤 70명 가족을 이끌고 고센에 정착해요. 야곱이 죽자 긴 장례 행렬이 막벨라 굴까지 가고, 요셉은 110세에 "내 뼈를 메고 올라가라"는 말을 남겨요.',
   places:['헤브론','브엘세바','고센','온','멤피스'],
   routes:[{who:'형들', color:'gosp', dashed:true, pts:['헤브론','멤피스']},{who:'야곱 가족 70명', color:'hist', pts:['헤브론','브엘세바','고센']},{who:'장례 행렬 (아닷 경유, 창 50:10)', color:'hist', dashed:true, pts:['고센','헤브론']}],
   people:[{name:'요셉', at:'멤피스'},{name:'야곱 가족', at:'고센'}],
   events:[{at:'멤피스', t:'바로의 꿈 해석, 30세에 총리. 형들과의 재회 (바로의 궁 위치는 추정)', ref:'창 41–45장'},{at:'온', t:'요셉의 아내 아스낫은 온 제사장의 딸', ref:'창 41:45'},{at:'브엘세바', t:'야곱이 이집트로 가기 전 제사', ref:'창 46:1'},{at:'고센', t:'70명 정착. 야곱 17년 더 삶. 요셉 110세에 죽음', ref:'창 46–50장'},{at:'헤브론', t:'야곱을 막벨라 굴에 장사', ref:'창 50장'}]},

  {week:1, id:'w1-9', title:'욥의 땅, 우스', ref:'욥기', era:'족장 시대로 봄', view:'uz', layer:'w1',
   note:'욥기는 "우스 땅"이 배경인데 어딘지 확실하지 않아요. 에돔 동쪽이나 북아라비아로 보는 설이 많아요. 사람 이름, 재산을 가축으로 세는 방식, 제사장 없이 가장이 직접 제사하는 모습 때문에 족장 시대 배경으로 봐요.',

  {week:2, id:'w2-0', title:'400년 뒤의 이집트', ref:'출 1–4', era:'BC 1526–1446', view:'sinai', layer:'w2',
   note:'요셉을 모르는 새 왕 (새 왕조로 보기도 해요). 이스라엘은 고센에서 노예가 되어 국고성 비돔과 라암셋을 짓고 있어요. 나일강에서 건져진 모세는 40세에 이집트 사람을 죽이고 미디안으로 도망쳐 40년을 살다가, 호렙 산 떨기나무에서 부르심을 받아요. 전통 연대로 출애굽은 BC 1446, 이때 이집트는 신왕국 18왕조의 전성기예요 (전통 연대로는 투트모세 3세 → 아멘호텝 2세 무렵).',
   places:['고센','멤피스','미디안','시내산'],

   people:[{name:'모세', at:'시내산'},{name:'이스라엘', at:'고센'}],
   events:[{at:'고센', t:'노예가 된 이스라엘, 국고성 비돔·라암셋 건설. 열 재앙 때 고센은 비껴감', ref:'출 1:11, 7–12장, 8:22, 9:26'},{at:'미디안', t:'모세의 피신 40년, 이드로의 딸 십보라', ref:'출 2장'},{at:'시내산', t:'호렙의 떨기나무, "내 백성을 애굽에서 인도하여 내라". 돌아오는 길에 여기서 아론을 만남', ref:'출 3:1–10, 4:27'}]},

  {week:2, id:'w2-1', title:'출애굽과 홍해', ref:'출 12–15', era:'BC 1446', view:'sinai', layer:'w2',
   note:'유월절 밤에 나와요. 해안 길(성경은 "블레셋 땅 길"이라 부르는데, 블레셋은 200년쯤 뒤에 오는 민족이라 지도에는 없어요)이 가까운데도 광야 길로 돌아가요. 숙곳, 에담, 그리고 바다 앞. 바로의 전차가 뒤에서 쫓아오고 바다가 갈라져요. 건넌 곳은 전통적으로 수에즈만 북쪽으로 보고, 아카바만으로 보는 설도 있어요. 마라의 쓴 물, 엘림의 샘 열두 개.',
   places:['고센','숙곳','홍해 횡단','마라','엘림','가사'],
   routes:[{who:'이스라엘', color:'proph', pts:['고센','숙곳','홍해 횡단','마라','엘림']},{who:'해안 길 (피함)', color:'proph', dashed:true, pts:['고센','가사']}],
   people:[{name:'모세와 이스라엘', at:'홍해 횡단'}],
   events:[{at:'고센', t:'유월절, 그 밤에 출발', ref:'출 12장'},{at:'홍해 횡단', t:'바다가 갈라짐, 바로의 군대가 빠짐', ref:'출 14장'},{at:'마라', t:'쓴 물', ref:'출 15:22–25'},{at:'엘림', t:'샘 12개, 종려 70그루', ref:'출 15:27'}]},

  {week:2, id:'w2-2', title:'시내산, 십계명과 성막', ref:'출 16–40 · 레위기 · 민 1–10', era:'BC 1446–1445', view:'sinai', layer:'w2',
   note:'만나와 메추라기, 르비딤에서 반석의 물과 아말렉과의 첫 전투. 그리고 시내산. 여기서 1년 가까이 머물러요. 십계명과 언약, 금송아지, 성막 완성. 레위기 전체와 민수기 앞부분이 이 한 곳에서 일어난 일이에요. 전통적 위치는 시내 반도 남쪽 예벨 무사예요.',
   places:['엘림','르비딤','시내산'],

  {week:2, id:'w2-3', title:'가데스바네아, 그리고 38년', ref:'민 10–25', era:'BC 1445–1407', view:'wander', layer:'w2',
   note:'시내산을 떠나 가데스바네아에서 열두 정탐꾼을 보내요. 40일 뒤 열 명은 "못 들어간다", 두 명은 "들어갈 수 있다". 백성이 울고, 그 세대는 광야에서 죽기로 정해져요. 38년을 가데스와 세일 산 둘레 광야에서 맴돈 뒤, 아론이 호르산에서 죽고, 에돔을 빙 돌아 아르논을 건너 아모리 왕 시혼과 바산 왕 옥을 꺾고 모압 평지에 이르러요.',
   places:['시내산','가데스바네아','헤브론','르홉','호르산','에시온게벨','아르논','헤스본','에드레이','모압 평지'],

  {week:2, id:'w2-4', title:'모압 평지, 모세의 고별', ref:'신명기', era:'BC 1406', view:'jordan', layer:'w2',
   note:'요단강 동쪽 모압 평지. 가나안이 바로 건너편이에요. 모세는 새 세대에게 지난 40년을 되짚고 율법을 다시 들려줘요. 신명기 전체가 이 자리의 설교예요. 그리고 느보산에 올라 약속의 땅을 바라보고 죽어요. 120세. 무덤은 아무도 몰라요.',

  {week:2, id:'w2-5', title:'요단강과 여리고', ref:'수 1–8', era:'BC 1406', view:'jordan', layer:'w2',
   note:'요단강이 멈추고 마른 땅으로 건너요. 길갈에 돌 열두 개. 여리고를 7일 돌고 성벽이 무너져요. 아이에서는 아간의 죄로 첫 패배, 다시 공격해 함락. 그리고 세겜의 에발산·그리심산에서 율법을 낭독해요.',

  {week:2, id:'w2-6', title:'남부와 북부 정복', ref:'수 9–12', era:'BC 1405–1400', view:'canaan', layer:'w2',
   note:'기브온 사람들이 먼 나라에서 온 척 속여 동맹을 맺어요. 남부 다섯 왕이 기브온을 치자 여호수아가 밤새 올라가 구하고, 해는 기브온 위에, 달은 아얄론 골짜기 위에 멈춰요. 남부를 휩쓸고 돌아온 뒤 북쪽 하솔 왕 야빈의 연합군을 메롬 물가에서 꺾어요. 약 6–7년의 전쟁 (갈렙의 나이로 계산).',

// 결혼 쌍과 "들어온 사람" (자녀의 아버지 쪽 집안에 자리를 둠)
const pairs=[],pseen=new Set();
P.forEach(p=>(p.s||[]).forEach(sid=>{const q=byId[sid];if(!q)return;const key=[p.id,sid].sort().join('|');if(pseen.has(key))return;pseen.add(key);pairs.push([p,q]);}));
const spousesOf=id=>pairs.filter(([a,b])=>a.id===id||b.id===id).map(([a,b])=>a.id===id?b:a);
const ownerOf={};
pairs.forEach(([a,b])=>{const ka=P.some(c=>c.f===a.id),kb=P.some(c=>c.f===b.id);let o;
  if(ka&&!kb)o=a;else if(kb&&!ka)o=b;else{const ha=!!(a.f||a.anc),hb=!!(b.f||b.anc);o=ha&&!hb?a:hb&&!ha?b:(a.main?a:b);}
  const m=o===a?b:a;if(!ownerOf[m.id])ownerOf[m.id]=o.id;});
const bpOf=p=>p.f&&byId[p.f]?{id:p.f,t:'f'}:p.m&&byId[p.m]?{id:p.m,t:'m'}:p.anc&&byId[p.anc]?{id:p.anc,t:'anc'}:null;
const slotKids=id=>P.filter(q=>q.f===id||(!q.f&&q.m===id)||(!q.f&&!q.m&&q.anc===id)).sort(by); // 태어난 자리 기준 자녀
const allKids=id=>P.filter(q=>q.f===id||q.m===id).sort(by);
const MILE=new Set(['adam','noah','abraham','jacob']);

let FOCUS=null;const EXPK=new Set(),EXPC=new Set();
function compute(F){
  const vis=new Set(),ali=new Set(),keep=new Set([F,...EXPC]);MILE.forEach(m=>keep.add(m));
  const f=byId[F];
  const addBirth=id=>{if(ownerOf[id])ali.add(id);else vis.add(id);};
  const addKidsOf=id=>{allKids(id).forEach(c=>{addBirth(c.id);spousesOf(c.id).filter(s=>ownerOf[s.id]===c.id).forEach(s=>vis.add(s.id));});};
  const up=(p,depth)=>{const bp=bpOf(p);

  if(ownerOf[F]){const o=byId[ownerOf[F]];vis.add(F);vis.add(o.id);keep.add(o.id);if(bpOf(f)){ali.add(F);up(f,0);const bp=bpOf(f);slotKids(bp.id).forEach(s=>addBirth(s.id));}up(o,0);}

// ===== 배치 =====
const NW=104,NH=40,CG=26,SG=16,VG=64,VGC=40,CHW=96,CHH=28,GG=8,GCOLS=4;

  u.x=x+(u.w-u.uw)/2;

  else{out[(u.alias?'a:':'p:')+u.id]={t:u.alias?'a':'p',id:u.id,x:u.x,y,hid:u.hid};
    u.sp.forEach((s,i)=>{out['p:'+s]={t:'p',id:s,x:u.x+(i+1)*(NW+CG),y,hid:0};});}

  const links=[];

    if(!u.chain&&u.sp.length){let prev='p:'+u.id;u.sp.forEach(s=>{links.push({t:'m',a:prev,b:'p:'+s,o:'p:'+u.id});prev='p:'+s;});}
    if(u.kids.length){const from=u.chain?{k:u.key,ch:true}:(u.sp.length===1?{k:'p:'+u.id,b:'p:'+u.sp[0]}:{k:(u.alias?'a:':'p:')+u.id});

function boxOf(e){if(e.t==='c')return{x:e.x,y:e.y,w:CHW,h:CHH};if(e.t==='g')return{x:e.x,y:e.y,w:e.w,h:e.h};return{x:e.x,y:e.y,w:NW,h:NH};}

function relayout(opts={}){const{pos,links}=layout(FOCUS);LINKS=links;
